<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 383 1018" width="383" role="img" aria-labelledby="block-validation-n-t block-validation-n-d"><title id="block-validation-n-t">Block validation</title><desc id="block-validation-n-d">A block from a peer is checked in order. If the format or signature is invalid, the block is rejected. If its parents are not in the DAG, it is buffered until they arrive. If the sender has no weight, the block is rejected. Then the block summary, state checkpoint, bonds cache, neglected invalid blocks, neglected equivocations and phlo price are validated, and a failure in any of them rejects the block, where a state hash mismatch fails the checkpoint. Last comes the equivocation check, and a block that passes it is added to the DAG and relayed.</desc><defs>
<marker id="block-validation-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
