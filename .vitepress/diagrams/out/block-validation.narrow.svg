<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 383 926" width="383" role="img" aria-labelledby="block-validation-n-t block-validation-n-d"><title id="block-validation-n-t">Block validation</title><desc id="block-validation-n-d">A block from a peer is checked in order. If the format or signature is invalid, the block is rejected. If its parents are not in the DAG, it is buffered until they arrive. Then the block summary, state checkpoint, bonds cache, neglected invalid blocks, neglected equivocations and phlo price are validated, and a failure in any of them rejects the block, where a state hash mismatch fails the checkpoint. Last comes the equivocation check, and a block that passes it is added to the DAG and relayed.</desc><defs>
