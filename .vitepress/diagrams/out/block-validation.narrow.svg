x="192.64" y="217" class="d-elabel" text-anchor="middle">No</text><text x="80.5" y="278.5" class="d-elabel" text-anchor="middle">Yes</text><text x="200" y="320" class="d-elabel" text-anchor="middle">invalid</text><text x="200" y="376" class="d-elabel" text-anchor="middle">state</text><text x="200" y="390" class="d-elabel" text-anchor="middle">hash</text><text x="200" y="404" class="d-elabel" text-anchor="middle">mismatch</text><text x="200" y="460" class="d-elabel" text-anchor="middle">invalid</text><text x="196.25" y="538" class="d-elabel" text-anchor="middle">invalid</text><text x="200" y="624" class="d-elabel" text-anchor="middle">invalid</text><text x="200" y="702" class="d-elabel" text-anchor="middle">invalid</text><text x="200" y="780" class="d-elabel" text-anchor="middle">equivocation</text></g><g class="d-node d-service"><rect x="4" y="906" width="22" height="14" rx="4"/></g><text x="34" y="917" class="d-meta">Check</text><g class="d-node d-decision"><polygon points="85,913 90,906 102,906 107,913 102,920 90,920"/></g><text x="115" y="917" class="d-meta">Decision</text><g class="d-node d-terminal"><rect x="186" y="906" width="22" height="14" rx="7"/></g><text x="216" y="917" class="d-meta">Start or end</text></svg>
