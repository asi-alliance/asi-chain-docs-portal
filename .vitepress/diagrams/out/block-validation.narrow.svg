l(#block-validation-n-a)"/><path d="M149.5 712 L279 712 Q287 712 287 704 L287 646" class="d-edge" marker-end="url(#block-validation-n-a)"/><path d="M137.5 790 L279 790 Q287 790 287 782 L287 646" class="d-edge" marker-end="url(#block-validation-n-a)"/><path d="M145.5 868 L279 868 Q287 868 287 860 L287 646" class="d-edge" marker-end="url(#block-validation-n-a)"/><g class="d-node d-terminal"><rect x="3.5" y="0" width="154" height="40" rx="20"/></g><text x="80.5" y="24" class="d-label" text-anchor="middle">Block received</text><g class="d-node d-decision"><polygon points="9.5,109 27.5,70 133.5,70 151.5,109 133.5,148 27.5,148"/></g><text x="80.5" y="97" class="d-label" text-anchor="middle">Format and</text><text x="80.5" y="113" class="d-label" text-anchor="middle">signature</text><text x="80.5" y="129" class="d-label" text-anchor="middle">valid?</text><g class="d-node d-decision"><polygon points="9.5,222 27.5,191 133.5,191 151.5,222 133.5,253 27.5,253"/></g><text x="80.5" y="218" class="d-label" text-anchor="middle">Parents in</text><text x="80.5" y="234" class="d-label" text-anchor="middle">DAG?</text><g class="d-node d-decision"><polygon points="9.5,327 27.5,296 133.5,296 151.5,327 133.5,358 27.5,358"/></g><text x="80.5" y="323" class="d-label" text-anchor="middle">Sender has</text><text x="80.5" y="339" class="d-label" text-anchor="middle">weight?</text><g class="d-node d-service"><rect x="11.5" y="388" width="138" height="40" rx="10"/></g><text x="80.5" y="412" class="d-label" text-anchor="middle">Block summary</text><g class="d-node d-service"><rect x="0" y="458" width="161" height="40" rx="10"/></g><text x="80.5" y="482" class="d-label" text-anchor="middle">State checkpoint</text><g class="d-node d-service"><rect x="19.5" y="528" width="122" height="40" rx="10"/></g><text x="80.5" y="552" class="d-label" text-anchor="middle">Bonds cache</text><g class="d-node d-service"><rect x="7.5" y="598" width="146" height="56" rx="10"/></g><text x="80.5" y="622" class="d-label" text-anchor="middle">Neglected</text><text x="80.5" y="638" class="d-label" text-anchor="middle">invalid blocks</text><g class="d-node d-service"><rect x="11.5" y="684" width="138" height="56" rx="10"/></g><text x="80.5" y="708" class="d-label" text-anchor="middle">Neglected</text><text x="80.5" y="724" class="d-label" text-anchor="middle">equivocations</text><g class="d-node d-service"><rect x="23.5" y="770" width="114" height="40" rx="10"/></g><text x="80.5" y="794" class="d-label" text-anchor="middle">Phlo price</text><g class="d-node d-service"><rect x="15.5" y="840" width="130" height="56" rx="10"/></g><text x="80.5" y="864" class="d-label" text-anchor="middle">Equivocation</text><text x="80.5" y="880" class="d-label" text-anchor="middle">check</text><g class="d-node d-terminal"><rect x="3.5" y="926" width="154" height="56" rx="28"/></g><text x="80.5" y="950" class="d-label" text-anchor="middle">Add to DAG and</text><text x="80.5" y="966" class="d-label" text-anchor="middle">relay</text><g class="d-node d-service"><rect x="239" y="178" width="96" height="88" rx="10"/></g><text x="287" y="202" class="d-label" text-anchor="middle">Buffer</text><text x="287" y="218" class="d-label" text-anchor="middle">until</text><text x="287" y="234" class="d-label" text-anchor="middle">parents</text><text x="287" y="250" class="d-label" text-anchor="middle">arrive</text><g class="d-node d-terminal"><rect x="239" y="606" width="96" height="40" rx="20"/></g><text x="287" y="630" class="d-label" text-anchor="middle">Reject</text><rect x="351" y="401" width="24" height="16" rx="4" class="d-chip"/><rect x="65" y="162.5" width="31" height="16" rx="4" class="d-chip"/><rect x="180.64" y="206" width="24" height="16" rx="4" class="d-chip"/><rect x="65" y="267.5" width="31" height="16" rx="4" class="d-chip"/><rect x="65" y="366" width="31" height="16" rx="4" class="d-chip"/><rect x="188" y="320" width="24" height="16" rx="4" class="d-chip"/><rect x="170.5" y="401" width="59" height="16" rx="4" class="d-chip"/><rect x="167" y="457" width="66" height="44" rx="4" class="d-chip"/><rect x="170.5" y="541" width="59" height="16" rx="4" class="d-chip"/><rect x="166.75" y="619" width="59" height="16" rx="4" class="d-chip"/><rect x="170.5" y="705" width="59" height="16" rx="4" class="d-chip"/><rect x="170.5" y="783" width="59" height="16" rx="4" class="d-chip"/><rect x="153.5" y="861" width="93" height="16" rx="4" class="d-chip"/><text x="363" y="412" class="d-elabel" text-anchor="middle">No</text><text x="80.5" y="173.5" class="d-elabel" text-anchor="middle">Yes</text><text x="192.64" y="217" class="d-elabel" text-anchor="middle">No</text><text x="80.5" y="278.5" class="d-elabel" text-anchor="middle">Yes</text><text x="80.5" y="377" class="d-elabel" text-anchor="middle">Yes</text><text x="200" y="331" class="d-elabel" text-anchor="middle">No</text><text x="200" y="412" class="d-elabel" text-anchor="middle">invalid</text><text x="200" y="468" class="d-elabel" text-anchor="middle">state</text><text x="200" y="482" class="d-elabel" text-anchor="middle">hash</text><text x="200" y="496" class="d-elabel" text-anchor="middle">mismatch</text><text x="200" y="552" class="d-elabel" text-anchor="middle">invalid</text><text x="196.25" y="630" class="d-elabel" text-anchor="middle">invalid</text><text x="200" y="716" class="d-elabel" text-anchor="middle">invalid</text><text x="200" y="794" class="d-elabel" text-anchor="middle">invalid</text><text x="200" y="872" class="d-elabel" text-anchor="middle">equivocation</text></g><g class="d-node d-service"><rect x="4" y="998" width="22" height="14" rx="4"/></g><text x="34" y="1009" class="d-meta">Check</text><g class="d-node d-decision"><polygon points="85,1005 90,998 102,998 107,1005 102,1012 90,1012"/></g><text x="115" y="1009" class="d-meta">Decision</text><g class="d-node d-terminal"><rect x="186" y="998" width="22" height="14" rx="7"/></g><text x="216" y="1009" class="d-meta">Start or end</text></svg>
