ss="d-edge" marker-end="url(#block-validation-n-a)"/><path d="M145.5 776 L279 776 Q287 776 287 768 L287 554" class="d-edge" marker-end="url(#block-validation-n-a)"/><g class="d-node d-terminal"><rect x="3.5" y="0" width="154" height="40" rx="20"/></g><text x="80.5" y="24" class="d-label" text-anchor="middle">Block received</text><g class="d-node d-decision"><polygon points="9.5,109 27.5,70 133.5,70 151.5,109 133.5,148 27.5,148"/></g><text x="80.5" y="97" class="d-label" text-anchor="middle">Format and</text><text x="80.5" y="113" class="d-label" text-anchor="middle">signature</text><text x="80.5" y="129" class="d-label" text-anchor="middle">valid?</text><g class="d-node d-decision"><polygon points="9.5,222 27.5,191 133.5,191 151.5,222 133.5,253 27.5,253"/></g><text x="80.5" y="218" class="d-label" text-anchor="middle">Parents in</text><text x="80.5" y="234" class="d-label" text-anchor="middle">DAG?</text><g class="d-node d-service"><rect x="11.5" y="296" width="138" height="40" rx="10"/></g><text x="80.5" y="320" class="d-label" text-anchor="middle">Block summary</text><g class="d-node d-service"><rect x="0" y="366" width="161" height="40" rx="10"/></g><text x="80.5" y="390" class="d-label" text-anchor="middle">State checkpoint</text><g class="d-node d-service"><rect x="19.5" y="436" width="122" height="40" rx="10"/></g><text x="80.5" y="460" class="d-label" text-anchor="middle">Bonds cache</text><g class="d-node d-service"><rect x="7.5" y="506" width="146" height="56" rx="10"/></g><text x="80.5" y="530" class="d-label" text-anchor="middle">Neglected</text><text x="80.5" y="546" class="d-label" text-anchor="middle">invalid blocks</text><g class="d-node d-service"><rect x="11.5" y="592" width="138" height="56" rx="10"/></g><text x="80.5" y="616" class="d-label" text-anchor="middle">Neglected</text><text x="80.5" y="632" class="d-label" text-anchor="middle">equivocations</text><g class="d-node d-service"><rect x="23.5" y="678" width="114" height="40" rx="10"/></g><tex