<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 316 726" width="316" role="img" aria-labelledby="node-components-n-t node-components-n-d"><title id="node-components-n-t">Node components</title><desc id="node-components-n-d">Three interfaces sit on top of the Rust node. Transport on 40400 and discovery on 40404 go to comm. The gRPC ports 40401 and 40402 and the HTTP ports 40403 and 40405 go to the node crate, which uses casper and comm. Casper uses rholang, block-storage, comm and the shared crates. Rholang uses rspace++, and block-storage uses the shared crates.</desc><defs>
<marker id="node-components-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="node-components-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(18 44)"><g class="d-group"><rect x="-14" y="-40" width="308" height="252" rx="14"/><text x="2" y="-17" class="d-gtitle">Interfaces</text></g><path d="M65 88 L65 238" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M150 44 L145 44 Q140 44 140 49 L140 257 Q140 262 145 262 L150 262" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M215 194 L215 238" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M215 310 L215 346" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M150 286 L130 286" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M150 398 L73 398 Q65 398 65 390 L65 310" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M150 398 L73 398 Q65 398 65 406 L65 501" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M215 450 L215 486" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M150 398 L145 398 Q140 398 140 403 L140 638 Q140 643 145 643 L150 643" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M65 557 L65 608" class="d-edge" marker-end="url(#node-components-n-a)"/><path d="M215 572 L215 615" class="d-edge" marker-end="url(#node-components-n-a)"/><g class="d-node d-service"><rect x="0" y="0" width="130" height="88" rx="10"/></g><text x="65" y="24" class="d-label" text-anchor="middle">Transport</text><text x="65" y="40" class="d-label" text-anchor="middle">40400,</text><text x="65" y="56" class="d-label" text-anchor="middle">discovery</text><text x="65" y="72" class="d-label" text-anchor="middle">40404</text><g class="d-node d-service"><rect x="150" y="8" width="130" height="72" rx="10"/></g><text x="215" y="32" class="d-label" text-anchor="middle">gRPC 40401</text><text x="215" y="48" class="d-label" text-anchor="middle">external,</text><text x="215" y="64" class="d-label" text-anchor="middle">40402 internal</text><g class="d-node d-service"><rect x="150" y="122" width="130" height="72" rx="10"/></g><text x="215" y="146" class="d-label" text-anchor="middle">HTTP 40403</text><text x="215" y="162" class="d-label" text-anchor="middle">public, 40405</text><text x="215" y="178" class="d-label" text-anchor="middle">admin</text><g class="d-node d-chain"><rect x="150" y="238" width="130" height="72" rx="10"/></g><text x="215" y="262" class="d-label" text-anchor="middle">node: runtime,</text><text x="215" y="278" class="d-label" text-anchor="middle">API servers,</text><text x="215" y="294" class="d-label" text-anchor="middle">web routes</text><g class="d-node d-chain"><rect x="0" y="238" width="130" height="72" rx="10"/></g><text x="65" y="262" class="d-label" text-anchor="middle">comm:</text><text x="65" y="278" class="d-label" text-anchor="middle">transport,</text><text x="65" y="294" class="d-label" text-anchor="middle">Kademlia, TLS</text><g class="d-node d-chain"><rect x="150" y="346" width="130" height="104" rx="10"/></g><text x="215" y="370" class="d-label" text-anchor="middle">casper:</text><text x="215" y="386" class="d-label" text-anchor="middle">engine,</text><text x="215" y="402" class="d-label" text-anchor="middle">proposer,</text><text x="215" y="418" class="d-label" text-anchor="middle">validation,</text><text x="215" y="434" class="d-label" text-anchor="middle">finality</text><g class="d-node d-chain"><rect x="0" y="501" width="130" height="56" rx="10"/></g><text x="65" y="525" class="d-label" text-anchor="middle">rholang:</text><text x="65" y="541" class="d-label" text-anchor="middle">interpreter</text><g class="d-node d-store"><path d="M150 493v72a65 7 0 0 0 130 0v-72a65 7 0 0 0 -130 0a65 7 0 0 0 130 0"/></g><text x="215" y="520" class="d-label" text-anchor="middle">block-storage:</text><text x="215" y="536" class="d-label" text-anchor="middle">blocks and DAG</text><text x="215" y="552" class="d-label" text-anchor="middle">on LMDB</text><g class="d-node d-service"><rect x="150" y="615" width="130" height="56" rx="10"/></g><text x="215" y="639" class="d-label" text-anchor="middle">models,</text><text x="215" y="655" class="d-label" text-anchor="middle">crypto, shared</text><g class="d-node d-store"><path d="M0 615v56a65 7 0 0 0 130 0v-56a65 7 0 0 0 -130 0a65 7 0 0 0 130 0"/></g><text x="65" y="642" class="d-label" text-anchor="middle">rspace++:</text><text x="65" y="658" class="d-label" text-anchor="middle">tuple space</text></g></svg>
