<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 253 520" width="253" role="img" aria-labelledby="deploy-lifecycle-n-t deploy-lifecycle-n-d"><title id="deploy-lifecycle-n-t">Deploy lifecycle</title><desc id="deploy-lifecycle-n-d">A client signs a deploy and posts it to the node, where it waits in the pending deploy pool. When the proposer runs with its constraints met, a validator creates and signs a block. The Rholang of the deploy is executed in RSpace++ and the block is broadcast to peers. The peers validate it and the block enters the DAG. The clique oracle then finalizes the block.</desc><defs>
<marker id="deploy-lifecycle-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="deploy-lifecycle-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(34 4)"><path d="M92.5 40 L92.5 88" class="d-edge" marker-end="url(#deploy-lifecycle-n-a)"/><path d="M92.5 128 L92.5 184" class="d-edge" marker-end="url(#deploy-lifecycle-n-a)"/><path d="M92.5 240 L92.5 296" class="d-edge" marker-end="url(#deploy-lifecycle-n-a)"/><path d="M92.5 336 L92.5 384" class="d-edge" marker-end="url(#deploy-lifecycle-n-a)"/><path d="M92.5 424 L92.5 472" class="d-edge" marker-end="url(#deploy-lifecycle-n-a)"/><g class="d-node d-service"><rect x="0" y="0" width="185" height="40" rx="10"/></g><text x="92.5" y="24" class="d-label" text-anchor="middle">Client signs deploy</text><g class="d-node d-service"><rect x="0" y="88" width="185" height="40" rx="10"/></g><text x="92.5" y="112" class="d-label" text-anchor="middle">Pending deploy pool</text><g class="d-node d-service"><rect x="8" y="184" width="169" height="56" rx="10"/></g><text x="92.5" y="208" class="d-label" text-anchor="middle">Block created and</text><text x="92.5" y="224" class="d-label" text-anchor="middle">signed</text><g class="d-node d-service"><rect x="4" y="296" width="177" height="40" rx="10"/></g><text x="92.5" y="320" class="d-label" text-anchor="middle">Broadcast to peers</text><g class="d-node d-service"><rect x="12" y="384" width="161" height="40" rx="10"/></g><text x="92.5" y="408" class="d-label" text-anchor="middle">Block in the DAG</text><g class="d-node d-chain"><rect x="16" y="472" width="153" height="40" rx="10"/></g><text x="92.5" y="496" class="d-label" text-anchor="middle">Block finalized</text><rect x="32" y="57" width="121" height="16" rx="4" class="d-chip"/><rect x="-30" y="149" width="245" height="16" rx="4" class="d-chip"/><rect x="-9.5" y="261" width="204" height="16" rx="4" class="d-chip"/><rect x="39" y="353" width="107" height="16" rx="4" class="d-chip"/><rect x="42.5" y="441" width="100" height="16" rx="4" class="d-chip"/><text x="92.5" y="68" class="d-elabel" text-anchor="middle">POST /api/deploy</text><text x="92.5" y="160" class="d-elabel" text-anchor="middle">proposer runs with constraints met</text><text x="92.5" y="272" class="d-elabel" text-anchor="middle">Rholang executed in RSpace++</text><text x="92.5" y="364" class="d-elabel" text-anchor="middle">peers validate</text><text x="92.5" y="452" class="d-elabel" text-anchor="middle">clique oracle</text></g></svg>
