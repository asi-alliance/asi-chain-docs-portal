<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 340 384" width="340" role="img" aria-labelledby="deploy-signing-w-t deploy-signing-w-d"><title id="deploy-signing-w-t">Deploy signing</title><desc id="deploy-signing-w-d">The SDK validates the recipient address and the amount and builds the transfer term for the node profile. It asks the read-only node for the latest block number, sets validAfterBlockNumber to that number minus 1, serializes the deploy fields, hashes them with blake2b and signs the hash with secp256k1.</desc><defs>
<marker id="deploy-signing-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="deploy-signing-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="61" y1="36" x2="61" y2="380" class="d-life"/><line x1="251" y1="36" x2="251" y2="380" class="d-life"/><g class="d-node d-chain"><rect x="8" y="0" width="106" height="36" rx="10"/></g><text x="61" y="22.5" class="d-label" text-anchor="middle">SDK Client</text><g class="d-node d-chain"><rect x="182" y="0" width="138" height="36" rx="10"/></g><text x="251" y="22.5" class="d-label" text-anchor="middle">Read-only node</text><path d="M61 72 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-w-a)"/><text x="125" y="79" class="d-seqlabel">Validate the recipient address</text><text x="125" y="93" class="d-seqlabel">and the amount</text><g class="d-badge"><circle cx="113" cy="82" r="8"/><text x="113" y="85.5" text-anchor="middle">1</text></g><path d="M61 120 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-w-a)"/><text x="125" y="127" class="d-seqlabel">Build the transfer term for</text><text x="125" y="141" class="d-seqlabel">the node profile</text><g class="d-badge"><circle cx="113" cy="130" r="8"/><text x="113" y="133.5" text-anchor="middle">2</text></g><path d="M63 180 H249" class="d-edge" marker-end="url(#deploy-signing-w-a)"/><text x="166" y="169" class="d-seqlabel" text-anchor="middle">GET /api/blocks</text><g class="d-badge"><circle cx="102" cy="165" r="8"/><text x="102" y="168.5" text-anchor="middle">3</text></g><path d="M249 222 H63" class="d-edge d-dashed" marker-end="url(#deploy-signing-w-a)"/><text x="166" y="211" class="d-seqlabel" text-anchor="middle">Latest block number</text><g class="d-badge"><circle cx="88" cy="207" r="8"/><text x="88" y="210.5" text-anchor="middle">4</text></g><path d="M61 252 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-w-a)"/><text x="125" y="259" class="d-seqlabel">validAfterBlockNumber = latest</text><text x="125" y="273" class="d-seqlabel">- 1</text><g class="d-badge"><circle cx="113" cy="262" r="8"/><text x="113" y="265.5" text-anchor="middle">5</text></g><path d="M61 296 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-w-a)"/><text x="125" y="310" class="d-seqlabel">Serialize the deploy fields</text><g class="d-badge"><circle cx="113" cy="306" r="8"/><text x="113" y="309.5" text-anchor="middle">6</text></g><path d="M61 340 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-w-a)"/><text x="125" y="347" class="d-seqlabel">Hash with blake2b and sign</text><text x="125" y="361" class="d-seqlabel">with secp256k1</text><g class="d-badge"><circle cx="113" cy="350" r="8"/><text x="113" y="353.5" text-anchor="middle">7</text></g></svg>
