<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 251 435" width="251" role="img" aria-labelledby="deploy-status-polling-n-t deploy-status-polling-n-d"><title id="deploy-status-polling-n-t">Deploy status polling</title><desc id="deploy-status-polling-n-d">Every 5 seconds, up to 180 seconds, the SDK asks the read-only node for the deploy and receives deploy info or an error. Then the SDK tells the wallet that the deploy is finalized, failed or timed out, and the wallet refreshes the balance and the history.</desc><defs>
<marker id="deploy-status-polling-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="deploy-status-polling-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="40.5" y1="68" x2="40.5" y2="431" class="d-life"/><line x1="119.5" y1="68" x2="119.5" y2="431" class="d-life"/><line x1="205.5" y1="68" x2="205.5" y2="431" class="d-life"/><g class="d-fragment"><rect x="91.5" y="102" width="151" height="181" rx="8"/><path d="M91.5 124h49v-22" class="d-fragline"/><text x="102.5" y="117" class="d-meta d-strong">loop</text><text x="152.5" y="117" class="d-meta">Every 5</text><text x="152.5" y="130" class="d-meta">seconds, up</text><text x="152.5" y="143" class="d-meta">to 180</text><text x="152.5" y="156" class="d-meta">seconds</text></g><g class="d-node d-service"><rect x="8" y="0" width="65" height="68" rx="10"/></g><text x="40.5" y="38.5" class="d-label" text-anchor="middle">Wallet</text><g class="d-node d-chain"><rect x="87" y="0" width="65" height="68" rx="10"/></g><text x="119.5" y="30.5" class="d-label" text-anchor="middle">SDK</text><text x="119.5" y="46.5" class="d-label" text-anchor="middle">Client</text><g class="d-node d-chain"><rect x="177" y="0" width="57" height="68" rx="10"/></g><text x="205.5" y="22.5" class="d-label" text-anchor="middle">Read-</text><text x="205.5" y="38.5" class="d-label" text-anchor="middle">only</text><text x="205.5" y="54.5" class="d-label" text-anchor="middle">node</text><path d="M121.5 205 H203.5" class="d-edge" marker-end="url(#deploy-status-polling-n-a)"/><text x="172.5" y="180" class="d-seqlabel" text-anchor="middle">GET /api/</text><text x="172.5" y="194" class="d-seqlabel" text-anchor="middle">deploy/{id}</text><g class="d-badge"><circle cx="122.5" cy="176" r="8"/><text x="122.5" y="179.5" text-anchor="middle">1</text></g><path d="M203.5 261 H121.5" class="d-edge d-dashed" marker-end="url(#deploy-status-polling-n-a)"/><text x="172.5" y="236" class="d-seqlabel" text-anchor="middle">Deploy info</text><text x="172.5" y="250" class="d-seqlabel" text-anchor="middle">or error</text><g class="d-badge"><circle cx="122.5" cy="232" r="8"/><text x="122.5" y="235.5" text-anchor="middle">2</text></g><path d="M117.5 343 H42.5" class="d-edge d-dashed" marker-end="url(#deploy-status-polling-n-a)"/><text x="90" y="304" class="d-seqlabel" text-anchor="middle">Finalized,</text><text x="90" y="318" class="d-seqlabel" text-anchor="middle">error or</text><text x="90" y="332" class="d-seqlabel" text-anchor="middle">timeout</text><g class="d-badge"><circle cx="43.5" cy="300" r="8"/><text x="43.5" y="303.5" text-anchor="middle">3</text></g><path d="M40.5 397 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-status-polling-n-a)"/><text x="88" y="374" class="d-seqlabel" text-anchor="middle">Refresh balance and</text><text x="88" y="388" class="d-seqlabel" text-anchor="middle">history</text><g class="d-badge"><circle cx="8" cy="370" r="8"/><text x="8" y="373.5" text-anchor="middle">4</text></g></svg>
