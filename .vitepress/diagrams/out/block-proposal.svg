<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 408 640" width="408" role="img" aria-labelledby="block-proposal-w-t block-proposal-w-d"><title id="block-proposal-w-t">Block proposal</title><desc id="block-proposal-w-d">A validator starts when the heartbeat check fires every 5 seconds or a deploy is submitted. If it is not bonded and active, it waits. If synchrony and height constraints are not met, it waits. Otherwise it creates a block from the deploy pool, executes the deploys, signs the block, adds it to the DAG, relays it to peers and waits again.</desc><defs>
<marker id="block-proposal-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="block-proposal-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M104 72 L104 106" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M206.5 129 L344 129 Q352 129 352 137 L352 217" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 152 L104 198" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M206.5 237 L304 237" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 276 L104 322" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 378 L104 408" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 448 L104 478" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 518 L104 548" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M200 576 L344 576 Q352 576 352 568 L352 257" class="d-edge" marker-end="url(#block-proposal-w-a)"/><g class="d-node d-terminal"><rect x="0" y="0" width="208" height="72" rx="36"/></g><text x="104" y="24" class="d-label" text-anchor="middle">Heartbeat check every</text><text x="104" y="40" class="d-label" text-anchor="middle">5 seconds or a deploy</text><text x="104" y="56" class="d-label" text-anchor="middle">is submitted</text><g class="d-node d-decision"><polygon points="1.5,129 19.5,106 188.5,106 206.5,129 188.5,152 19.5,152"/></g><text x="104" y="133" class="d-label" text-anchor="middle">Bonded and active?</text><g class="d-node d-decision"><polygon points="1.5,237 19.5,198 188.5,198 206.5,237 188.5,276 19.5,276"/></g><text x="104" y="225" class="d-label" text-anchor="middle">Synchrony and</text><text x="104" y="241" class="d-label" text-anchor="middle">height constraints</text><text x="104" y="257" class="d-label" text-anchor="middle">met?</text><g class="d-node d-service"><rect x="19.5" y="322" width="169" height="56" rx="10"/></g><text x="104" y="346" class="d-label" text-anchor="middle">Create block from</text><text x="104" y="362" class="d-label" text-anchor="middle">deploy pool</text><g class="d-node d-service"><rect x="27.5" y="408" width="153" height="40" rx="10"/></g><text x="104" y="432" class="d-label" text-anchor="middle">Execute deploys</text><g class="d-node d-service"><rect x="47" y="478" width="114" height="40" rx="10"/></g><text x="104" y="502" class="d-label" text-anchor="middle">Sign block</text><g class="d-node d-service"><rect x="8" y="548" width="192" height="56" rx="10"/></g><text x="104" y="572" class="d-label" text-anchor="middle">Add to DAG and relay</text><text x="104" y="588" class="d-label" text-anchor="middle">to peers</text><g class="d-node d-terminal"><rect x="304" y="217" width="96" height="40" rx="20"/></g><text x="352" y="241" class="d-label" text-anchor="middle">Wait</text><rect x="267.25" y="122" width="24" height="16" rx="4" class="d-chip"/><rect x="88.5" y="168" width="31" height="16" rx="4" class="d-chip"/><rect x="243.25" y="230" width="24" height="16" rx="4" class="d-chip"/><rect x="88.5" y="292" width="31" height="16" rx="4" class="d-chip"/><text x="279.25" y="133" class="d-elabel" text-anchor="middle">No</text><text x="104" y="179" class="d-elabel" text-anchor="middle">Yes</text><text x="255.25" y="241" class="d-elabel" text-anchor="middle">No</text><text x="104" y="303" class="d-elabel" text-anchor="middle">Yes</text></g><g class="d-node d-service"><rect x="4" y="620" width="22" height="14" rx="4"/></g><text x="34" y="631" class="d-meta">Service</text><g class="d-node d-decision"><rect x="99" y="620" width="22" height="14" rx="4"/></g><text x="129" y="631" class="d-meta">Decision</text><g class="d-node d-terminal"><rect x="200" y="620" width="22" height="14" rx="7"/></g><text x="230" y="631" class="d-meta">Start or end</text></svg>
