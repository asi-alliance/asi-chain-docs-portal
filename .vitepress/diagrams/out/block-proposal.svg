<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 408 748" width="408" role="img" aria-labelledby="block-proposal-w-t block-proposal-w-d"><title id="block-proposal-w-t">Block proposal</title><desc id="block-proposal-w-d">A validator starts when the heartbeat check fires every 3 seconds or a deploy is submitted. If it is not bonded and active, it waits. If the synchrony constraint is not met, it waits. If the height constraint is not met and the shard is not stalled, it waits too. Otherwise it creates a block from the deploy pool, executes the deploys, signs the block, adds it to the DAG, relays it to peers and waits again.</desc><defs>
<marker id="block-proposal-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="block-proposal-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M104 72 L104 106" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M206.5 129 L344 129 Q352 129 352 137 L352 209" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 152 L104 198" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M194.5 229 L304 229" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 260 L104 306" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M202.5 345 L344 345 Q352 345 352 337 L352 249" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 384 L104 430" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 486 L104 516" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 556 L104 586" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M104 626 L104 656" class="d-edge" marker-end="url(#block-proposal-w-a)"/><path d="M200 684 L344 684 Q352 684 352 676 L352 249" class="d-edge" marker-end="url(#block-proposal-w-a)"/><g class="d-node d-terminal"><rect x="0" y="0" width="208" height="72" rx="36"/></g><text x="104" y="24" class="d-label" text-anchor="middle">Heartbeat check every</text><text x="104" y="40" class="d-label" text-anchor="middle">3 seconds or a deploy</text><text x="104" y="56" class="d-label" text-anchor="middle">is submitted</text><g class="d-node d-decision"><polygon points="1.5,129 19.5,106 188.5,106 206.5,129 188.5,152 19.5,152"/></g><text x="104" y="133" class="d-label" text-anchor="middle">Bonded and active?</text><g class="d-node d-decision"><polygon points="13.5,229 31.5,198 176.5,198 194.5,229 176.5,260 31.5,260"/></g><text x="104" y="225" class="d-label" text-anchor="middle">Synchrony</text><text x="104" y="241" class="d-label" text-anchor="middle">constraint met?</text><g class="d-node d-decision"><polygon points="5.5,345 23.5,306 184.5,306 202.5,345 184.5,384 23.5,384"/></g><text x="104" y="333" class="d-label" text-anchor="middle">Height constraint</text><text x="104" y="349" class="d-label" text-anchor="middle">met, or shard</text><text x="104" y="365" class="d-label" text-anchor="middle">stalled?</text><g class="d-node d-service"><rect x="19.5" y="430" width="169" height="56" rx="10"/></g><text x="104" y="454" class="d-label" text-anchor="middle">Create block from</text><text x="104" y="470" class="d-label" text-anchor="middle">deploy pool</text><g class="d-node d-service"><rect x="27.5" y="516" width="153" height="40" rx="10"/></g><text x="104" y="540" class="d-label" text-anchor="middle">Execute deploys</text><g class="d-node d-service"><rect x="47" y="586" width="114" height="40" rx="10"/></g><text x="104" y="610" class="d-label" text-anchor="middle">Sign block</text><g class="d-node d-service"><rect x="8" y="656" width="192" height="56" rx="10"/></g><text x="104" y="680" class="d-label" text-anchor="middle">Add to DAG and relay</text><text x="104" y="696" class="d-label" text-anchor="middle">to peers</text><g class="d-node d-terminal"><rect x="304" y="209" width="96" height="40" rx="20"/></g><text x="352" y="233" class="d-label" text-anchor="middle">Wait</text><rect x="267.25" y="122" width="24" height="16" rx="4" class="d-chip"/><rect x="88.5" y="168" width="31" height="16" rx="4" class="d-chip"/><rect x="237.25" y="222" width="24" height="16" rx="4" class="d-chip"/><rect x="88.5" y="276" width="31" height="16" rx="4" class="d-chip"/><rect x="265.25" y="338" width="24" height="16" rx="4" class="d-chip"/><rect x="88.5" y="400" width="31" height="16" rx="4" class="d-chip"/><text x="279.25" y="133" class="d-elabel" text-anchor="middle">No</text><text x="104" y="179" class="d-elabel" text-anchor="middle">Yes</text><text x="249.25" y="233" class="d-elabel" text-anchor="middle">No</text><text x="104" y="287" class="d-elabel" text-anchor="middle">Yes</text><text x="277.25" y="349" class="d-elabel" text-anchor="middle">No</text><text x="104" y="411" class="d-elabel" text-anchor="middle">Yes</text></g><g class="d-node d-service"><rect x="4" y="728" width="22" height="14" rx="4"/></g><text x="34" y="739" class="d-meta">Service</text><g class="d-node d-decision"><polygon points="99,735 104,728 116,728 121,735 116,742 104,742"/></g><text x="129" y="739" class="d-meta">Decision</text><g class="d-node d-terminal"><rect x="200" y="728" width="22" height="14" rx="7"/></g><text x="230" y="739" class="d-meta">Start or end</text></svg>
