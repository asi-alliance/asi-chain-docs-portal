<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 857 582" width="857" role="img" aria-labelledby="node-components-w-t node-components-w-d"><title id="node-components-w-t">Node components</title><desc id="node-components-w-d">Three interfaces sit on top of the Rust node. Transport on 40400 and discovery on 40404 go to comm. The gRPC ports 40401 and 40402 and the HTTP ports 40403 and 40405 go to the node crate, which uses casper and comm. Casper uses rholang, block-storage, comm and the shared crates. Rholang uses rspace++, and block-storage uses the shared crates.</desc><defs>
