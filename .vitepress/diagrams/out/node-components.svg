y="0" width="177" height="56" rx="10"/></g><text x="545.5" y="24" class="d-label" text-anchor="middle">HTTP 40403 public,</text><text x="545.5" y="40" class="d-label" text-anchor="middle">40405 admin</text><g class="d-node d-chain"><rect x="342.5" y="100" width="185" height="56" rx="10"/></g><text x="435" y="124" class="d-label" text-anchor="middle">node: runtime, API</text><text x="435" y="140" class="d-label" text-anchor="middle">servers, web routes</text><g class="d-node d-chain"><rect x="0" y="214" width="161" height="56" rx="10"/></g><text x="80.5" y="238" class="d-label" text-anchor="middle">comm: transport,</text><text x="80.5" y="254" class="d-label" text-anchor="middle">Kademlia, TLS</text><g class="d-node d-chain"><rect x="339" y="206" width="192" height="72" rx="10"/></g><text x="435" y="230" class="d-label" text-anchor="middle">casper: engine,</text><text x="435" y="246" class="d-label" text-anchor="middle">proposer,</text><text x="435" y="262" class="d-label" text-anchor="middle">validation, finality</text><g class="d-node d-chain"><rect x="221" y="351" width="192" height="40" rx="10"/></g><text x="317" y="375" class="d-label" text-anchor="middle">rholang: interpreter</text><g class="d-node d-store"><path d="M461 335v72a84.5 7 0 0 0 169 0v-72a84.5 7 0 0 0 -169 0a84.5 7 0 0 0 169 0"/></g><text x="545.5" y="362" class="d-label" text-anchor="middle">block-storage:</text><text x="545.5" y="378" class="d-label" text-anchor="middle">blocks and DAG on</text><text x="545.5" y="394" class="d-label" text-anchor="middle">LMDB</text><g class="d-node d-service"><rect x="678" y="343" width="153" height="56" rx="10"/></g><text x="754.5" y="367" class="d-label" text-anchor="middle">models, crypto,</text><text x="754.5" y="383" class="d-label" text-anchor="middle">shared</text><g class="d-node d-store"><path d="M240.5 471v56a76.5 7 0 0 0 153 0v-56a76.5 7 0 0 0 -153 0a76.5 7 0 0 0 153 0"/></g><text x="317" y="498" class="d-label" text-anchor="middle">rspace++: tuple</tex