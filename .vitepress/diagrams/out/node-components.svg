281.5" y="56" class="d-label" text-anchor="middle">internal</text><g class="d-node d-service"><rect x="402" y="8" width="177" height="56" rx="10"/></g><text x="490.5" y="32" class="d-label" text-anchor="middle">HTTP 40403 public,</text><text x="490.5" y="48" class="d-label" text-anchor="middle">40405 admin</text><g class="d-node d-chain"><rect x="291.5" y="116" width="177" height="72" rx="10"/></g><text x="380" y="140" class="d-label" text-anchor="middle">node: runtime, API</text><text x="380" y="156" class="d-label" text-anchor="middle">servers, web</text><text x="380" y="172" class="d-label" text-anchor="middle">routes</text><g class="d-node d-chain"><rect x="0" y="254" width="161" height="56" rx="10"/></g><text x="80.5" y="278" class="d-label" text-anchor="middle">comm: transport,</text><text x="80.5" y="294" class="d-label" text-anchor="middle">Kademlia, TLS</text><g class="d-node d-chain"><rect x="303.5" y="238" width="153" height="88" rx="10"/></g><text x="380" y="262" class="d-label" text-anchor="middle">casper: engine,</text><text x="380" y="278" class="d-label" text-anchor="middle">proposer,</text><text x="380" y="294" class="d-label" text-anchor="middle">validation,</text><text x="380" y="310" class="d-label" text-anchor="middle">finality</text><g class="d-node d-chain"><rect x="220.5" y="391" width="122" height="56" rx="10"/></g><text x="281.5" y="415" class="d-label" text-anchor="middle">rholang:</text><text x="281.5" y="431" class="d-label" text-anchor="middle">interpreter</text><g class="d-node d-store"><path d="M406 383v72a84.5 7 0 0 0 169 0v-72a84.5 7 0 0 0 -169 0a84.5 7 0 0 0 169 0"/></g><text x="490.5" y="410" class="d-label" text-anchor="middle">block-storage:</text><text x="490.5" y="426" class="d-label" text-anchor="middle">blocks and DAG on</text><text x="490.5" y="442" class="d-label" text-anchor="middle">LMDB</text><g class="d-node d-service"><rect x="414" y="519" width="153" height="56" rx="10"/></g><text x="490.5" y="543" class="d-label" text-anchor="middle">models, crypto,</text><text x="490.5" y="559" class="d-label" text-anchor="middle">shared</text><g class="d-node d-store"><path d="M205 519v56a76.5 7 0 0 0 153 0v-56a76.5 7 0 0 0 -153 0a76.5 7 0 0 0 153 0"/></g><text x="281.5" y="546" class="d-label" text-anchor="middle">rspace++: tuple</text><text x="281.5" y="562" class="d-label" text-anchor="middle">space</text></g></svg>
