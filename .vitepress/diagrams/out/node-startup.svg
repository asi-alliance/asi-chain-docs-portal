<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 447 654" width="447" role="img" aria-labelledby="node-startup-w-t node-startup-w-d"><title id="node-startup-w-t">Node startup</title><desc id="node-startup-w-d">The node loads its configuration, keys and storage, chooses a launch mode, starts the transport, Kademlia, gRPC and HTTP servers, and starts the node discovery and clear-connections loops. A node that is not standalone waits for its first peer connection. Then it runs engine init and reaches the Running state. If engine init fails, the node shuts down.</desc><defs>
<marker id="node-startup-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="node-startup-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M267.5 56 L267.5 84" class="d-edge" marker-end="url(#node-startup-w-a)"/><path d="M267.5 124 L267.5 152" class="d-edge" marker-end="url(#node-startup-w-a)"/><path d="M267.5 208 L267.5 236" class="d-edge" marker-end="url(#node-startup-w-a)"/><path d="M267.5 292 L267.5 320" class="d-edge" marker-end="url(#node-startup-w-a)"/><path d="M267.5 366 L267.5 394" class="d-edge" marker-end="url(#node-startup-w-a)"/><path d="M342.5 343 L431 343 Q439 343 439 351 L439 506 Q439 514 431 514 L344 514" class="d-edge" marker-end="url(#node-startup-w-a)"/><path d="M267.5 450 L267.5 494" class="d-edge" marker-end="url(#node-startup-w-a)"/><path d="M267.5 534 L267.5 578" class="d-edge" marker-end="url(#node-startup-w-a)"/><path d="M191 514 L96 514" class="d-edge" marker-end="url(#node-startup-w-a)"/><g class="d-node d-service"><rect x="155.5" y="0" width="224" height="56" rx="10"/></g><text x="267.5" y="24" class="d-label" text-anchor="middle">Load configuration, keys</text><text x="267.5" y="40" class="d-label" text-anchor="middle">and storage</text><g class="d-node d-service"><rect x="179" y="84" width="177" height="40" rx="10"/></g><text x="267.5" y="108" class="d-label" text-anchor="middle">Choose launch mode</text><g class="d-node d-service"><rect x="152" y="152" width="231" height="56" rx="10"/></g><text x="267.5" y="176" class="d-label" text-anchor="middle">Start servers: transport,</text><text x="267.5" y="192" class="d-label" text-anchor="middle">Kademlia, gRPC, HTTP</text><g class="d-node d-service"><rect x="155.5" y="236" width="224" height="56" rx="10"/></g><text x="267.5" y="260" class="d-label" text-anchor="middle">Start node discovery and</text><text x="267.5" y="276" class="d-label" text-anchor="middle">clear-connections loops</text><g class="d-node d-decision"><polygon points="192.5,343 210.5,320 324.5,320 342.5,343 324.5,366 210.5,366"/></g><text x="267.5" y="347" class="d-label" text-anchor="middle">Standalone?</text><g class="d-node d-service"><rect x="175" y="394" width="185" height="56" rx="10"/></g><text x="267.5" y="418" class="d-label" text-anchor="middle">Wait for first peer</text><text x="267.5" y="434" class="d-label" text-anchor="middle">connection</text><g class="d-node d-service"><rect x="191" y="494" width="153" height="40" rx="10"/></g><text x="267.5" y="518" class="d-label" text-anchor="middle">Run engine init</text><g class="d-node d-terminal"><rect x="218" y="578" width="99" height="40" rx="20"/></g><text x="267.5" y="602" class="d-label" text-anchor="middle">Running</text><g class="d-node d-terminal"><rect x="0" y="478" width="96" height="72" rx="36"/></g><text x="48" y="502" class="d-label" text-anchor="middle">Node</text><text x="48" y="518" class="d-label" text-anchor="middle">shuts</text><text x="48" y="534" class="d-label" text-anchor="middle">down</text><rect x="255.5" y="373" width="24" height="16" rx="4" class="d-chip"/><rect x="395.5" y="336" width="31" height="16" rx="4" class="d-chip"/><rect x="121" y="507" width="45" height="16" rx="4" class="d-chip"/><text x="267.5" y="384" class="d-elabel" text-anchor="middle">No</text><text x="411" y="347" class="d-elabel" text-anchor="middle">Yes</text><text x="143.5" y="518" class="d-elabel" text-anchor="middle">error</text></g><g class="d-node d-service"><rect x="4" y="634" width="22" height="14" rx="4"/></g><text x="34" y="645" class="d-meta">Service</text><g class="d-node d-decision"><polygon points="99,641 104,634 116,634 121,641 116,648 104,648"/></g><text x="129" y="645" class="d-meta">Decision</text><g class="d-node d-terminal"><rect x="200" y="634" width="22" height="14" rx="7"/></g><text x="230" y="645" class="d-meta">Start or end</text></svg>
