<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 638 200" width="638" role="img" aria-labelledby="deploy-lifecycle-w-t deploy-lifecycle-w-d"><title id="deploy-lifecycle-w-t">Deploy lifecycle</title><desc id="deploy-lifecycle-w-d">A client signs a deploy and posts it to the node, where it waits in the pending deploy pool. When the proposer runs with its constraints met, a validator creates and signs a block. The Rholang of the deploy is executed in RSpace++ and the block is broadcast to peers. The peers validate it and the block enters the DAG. The clique oracle then finalizes the block.</desc><defs>
<marker id="deploy-lifecycle-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="deploy-lifecycle-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M130 36 L254 36" class="d-edge" marker-end="url(#deploy-lifecycle-w-a)"/><path d="M376 36 L504 36" class="d-edge" marker-end="url(#deploy-lifecycle-w-a)"/><path d="M565 72 L565 136" class="d-edge" marker-end="url(#deploy-lifecycle-w-a)"/><path d="M500 164 L380 164" class="d-edge" marker-end="url(#deploy-lifecycle-w-a)"/><path d="M250 164 L118.5 164" class="d-edge" marker-end="url(#deploy-lifecycle-w-a)"/><g class="d-node d-service"><rect x="0" y="8" width="130" height="56" rx="10"/></g><text x="65" y="32" class="d-label" text-anchor="middle">Client signs</text><text x="65" y="48" class="d-label" text-anchor="middle">deploy</text><g class="d-node d-service"><rect x="254" y="8" width="122" height="56" rx="10"/></g><text x="315" y="32" class="d-label" text-anchor="middle">Pending</text><text x="315" y="48" class="d-label" text-anchor="middle">deploy pool</text><g class="d-node d-service"><rect x="504" y="0" width="122" height="72" rx="10"/></g><text x="565" y="24" class="d-label" text-anchor="middle">Block</text><text x="565" y="40" class="d-label" text-anchor="middle">created and</text><text x="565" y="56" class="d-label" text-anchor="middle">signed</text><g class="d-node d-service"><rect x="500" y="136" width="130" height="56" rx="10"/></g><text x="565" y="160" class="d-label" text-anchor="middle">Broadcast to</text><text x="565" y="176" class="d-label" text-anchor="middle">peers</text><g class="d-node d-service"><rect x="250" y="136" width="130" height="56" rx="10"/></g><text x="315" y="160" class="d-label" text-anchor="middle">Block in the</text><text x="315" y="176" class="d-label" text-anchor="middle">DAG</text><g class="d-node d-chain"><rect x="11.5" y="136" width="107" height="56" rx="10"/></g><text x="65" y="160" class="d-label" text-anchor="middle">Block</text><text x="65" y="176" class="d-label" text-anchor="middle">finalized</text><rect x="131.5" y="29" width="121" height="16" rx="4" class="d-chip"/><rect x="379.5" y="15" width="121" height="44" rx="4" class="d-chip"/><rect x="504.5" y="90" width="121" height="30" rx="4" class="d-chip"/><rect x="386.5" y="157" width="107" height="16" rx="4" class="d-chip"/><rect x="134.25" y="157" width="100" height="16" rx="4" class="d-chip"/><text x="192" y="40" class="d-elabel" text-anchor="middle">POST /api/deploy</text><text x="440" y="26" class="d-elabel" text-anchor="middle">proposer runs</text><text x="440" y="40" class="d-elabel" text-anchor="middle">with constraints</text><text x="440" y="54" class="d-elabel" text-anchor="middle">met</text><text x="565" y="101" class="d-elabel" text-anchor="middle">Rholang executed</text><text x="565" y="115" class="d-elabel" text-anchor="middle">in RSpace++</text><text x="440" y="168" class="d-elabel" text-anchor="middle">peers validate</text><text x="184.25" y="168" class="d-elabel" text-anchor="middle">clique oracle</text></g></svg>
