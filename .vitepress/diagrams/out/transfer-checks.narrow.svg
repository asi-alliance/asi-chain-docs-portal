<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 301 767" width="301" role="img" aria-labelledby="transfer-checks-n-t transfer-checks-n-d"><title id="transfer-checks-n-t">Check and reserve</title><desc id="transfer-checks-n-d">The user enters the recipient and amount in the wallet. The wallet calls transfer on the SDK client. If the session is locked or the policy asks for a password on every signature, the SDK asks the wallet for a password and the user provides it. The SDK computes pending as amount plus maximum fee, queries the balance from the read-only node through explore-deploy, and checks that the balance minus reserved funds covers pending.</desc><defs>
<marker id="transfer-checks-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="transfer-checks-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="33" y1="68" x2="33" y2="763" class="d-life"/><line x1="112" y1="68" x2="112" y2="763" class="d-life"/><line x1="191" y1="68" x2="191" y2="763" class="d-life"/><line x1="264" y1="68" x2="264" y2="763" class="d-life"/><g class="d-fragment"><rect x="5" y="256" width="214" height="237" rx="8"/><path d="M5 278h42v-22" class="d-fragline"/><text x="16" y="271" class="d-meta d-strong">opt</text><text x="59" y="271" class="d-meta">Session is locked or</text><text x="59" y="284" class="d-meta">the policy asks for a</text><text x="59" y="297" class="d-meta">password on every</text><text x="59" y="310" class="d-meta">signature</text></g><g class="d-node d-external"><rect x="8" y="0" width="50" height="68" rx="10"/></g><text x="33" y="38.5" class="d-label" text-anchor="middle">User</text><g class="d-node d-service"><rect x="79.5" y="0" width="65" height="68" rx="10"/></g><text x="112" y="38.5" class="d-label" text-anchor="middle">Wallet</text><g class="d-node d-chain"><rect x="158.5" y="0" width="65" height="68" rx="10"/></g><text x="191" y="30.5" class="d-label" text-anchor="middle">SDK</text><text x="191" y="46.5" class="d-label" text-anchor="middle">Client</text><g class="d-node d-chain"><rect x="235.5" y="0" width="57" height="68" rx="10"/></g><text x="264" y="22.5" class="d-label" text-anchor="middle">Read-</text><text x="264" y="38.5" class="d-label" text-anchor="middle">only</text><text x="264" y="54.5" class="d-label" text-anchor="middle">node</text><path d="M35 144 H110" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="82.5" y="105" class="d-seqlabel" text-anchor="middle">Enter</text><text x="82.5" y="119" class="d-seqlabel" text-anchor="middle">recipient</text><text x="82.5" y="133" class="d-seqlabel" text-anchor="middle">and amount</text><g class="d-badge"><circle cx="36" cy="101" r="8"/><text x="36" y="104.5" text-anchor="middle">1</text></g><path d="M114 228 H189" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="161.5" y="175" class="d-seqlabel" text-anchor="middle">transfer(</text><text x="161.5" y="189" class="d-seqlabel" text-anchor="middle">account,</text><text x="161.5" y="203" class="d-seqlabel" text-anchor="middle">recipient,</text><text x="161.5" y="217" class="d-seqlabel" text-anchor="middle">amount)</text><g class="d-badge"><circle cx="115" cy="171" r="8"/><text x="115" y="174.5" text-anchor="middle">2</text></g><path d="M189 359 H114" class="d-edge d-dashed" marker-end="url(#transfer-checks-n-a)"/><text x="161.5" y="334" class="d-seqlabel" text-anchor="middle">Password</text><text x="161.5" y="348" class="d-seqlabel" text-anchor="middle">required</text><g class="d-badge"><circle cx="121.5" cy="330" r="8"/><text x="121.5" y="333.5" text-anchor="middle">3</text></g><path d="M110 415 H35" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="82.5" y="390" class="d-seqlabel" text-anchor="middle">Request</text><text x="82.5" y="404" class="d-seqlabel" text-anchor="middle">password</text><g class="d-badge"><circle cx="42.5" cy="386" r="8"/><text x="42.5" y="389.5" text-anchor="middle">4</text></g><path d="M35 471 H110" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="82.5" y="446" class="d-seqlabel" text-anchor="middle">Provide</text><text x="82.5" y="460" class="d-seqlabel" text-anchor="middle">password</text><g class="d-badge"><circle cx="42.5" cy="442" r="8"/><text x="42.5" y="445.5" text-anchor="middle">5</text></g><path d="M191 537 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="190" y="514" class="d-seqlabel" text-anchor="middle">pending = amount + maximum</text><text x="190" y="528" class="d-seqlabel" text-anchor="middle">fee</text><g class="d-badge"><circle cx="86" cy="510" r="8"/><text x="86" y="513.5" text-anchor="middle">6</text></g><path d="M193 633 H262" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="237.5" y="580" class="d-seqlabel" text-anchor="middle">Query</text><text x="237.5" y="594" class="d-seqlabel" text-anchor="middle">balance</text><text x="237.5" y="608" class="d-seqlabel" text-anchor="middle">(explore-</text><text x="237.5" y="622" class="d-seqlabel" text-anchor="middle">deploy)</text><g class="d-badge"><circle cx="194" cy="576" r="8"/><text x="194" y="579.5" text-anchor="middle">7</text></g><path d="M262 675 H193" class="d-edge d-dashed" marker-end="url(#transfer-checks-n-a)"/><text x="237.5" y="664" class="d-seqlabel" text-anchor="middle">Balance</text><g class="d-badge"><circle cx="201" cy="660" r="8"/><text x="201" y="663.5" text-anchor="middle">8</text></g><path d="M191 729 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="191" y="706" class="d-seqlabel" text-anchor="middle">Balance minus reserved</text><text x="191" y="720" class="d-seqlabel" text-anchor="middle">funds covers pending?</text><g class="d-badge"><circle cx="101" cy="702" r="8"/><text x="101" y="705.5" text-anchor="middle">9</text></g></svg>
