<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 463 716" width="463" role="img" aria-labelledby="transfer-checks-n-t transfer-checks-n-d"><title id="transfer-checks-n-t">Check and reserve</title><desc id="transfer-checks-n-d">The user enters the recipient and amount in the wallet. The wallet calls transfer on the SDK client. If the session is locked or the policy asks for a password on every signature, the SDK asks the wallet for a password and the user provides it. The SDK computes pending as amount plus maximum fee, queries the balance from the read-only node through explore-deploy, and checks that the balance minus reserved funds covers pending.</desc><defs>
<marker id="transfer-checks-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="transfer-checks-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="38" y1="52" x2="38" y2="712" class="d-life"/><line x1="159" y1="52" x2="159" y2="712" class="d-life"/><line x1="280" y1="52" x2="280" y2="712" class="d-life"/><line x1="395" y1="52" x2="395" y2="712" class="d-life"/><g class="d-fragment"><rect x="10" y="240" width="298" height="224" rx="8"/><path d="M10 262h42v-22" class="d-fragline"/><text x="21" y="255" class="d-meta d-strong">opt</text><text x="64" y="255" class="d-meta">Session is locked or the policy</text><text x="64" y="268" class="d-meta">asks for a password on every</text><text x="64" y="281" class="d-meta">signature</text></g><g class="d-node d-external"><rect x="8" y="0" width="60" height="52" rx="10"/></g><text x="38" y="30.5" class="d-label" text-anchor="middle">User</text><g class="d-node d-service"><rect x="121.5" y="0" width="75" height="52" rx="10"/></g><text x="159" y="30.5" class="d-label" text-anchor="middle">Wallet</text><g class="d-node d-chain"><rect x="242.5" y="0" width="75" height="52" rx="10"/></g><text x="280" y="22.5" class="d-label" text-anchor="middle">SDK</text><text x="280" y="38.5" class="d-label" text-anchor="middle">Client</text><g class="d-node d-chain"><rect x="345.5" y="0" width="99" height="52" rx="10"/></g><text x="395" y="22.5" class="d-label" text-anchor="middle">Read-only</text><text x="395" y="38.5" class="d-label" text-anchor="middle">node</text><path d="M40 128 H157" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="108.5" y="89" class="d-seqlabel" text-anchor="middle">Enter</text><text x="108.5" y="103" class="d-seqlabel" text-anchor="middle">recipient</text><text x="108.5" y="117" class="d-seqlabel" text-anchor="middle">and amount</text><g class="d-badge"><circle cx="62" cy="85" r="8"/><text x="62" y="88.5" text-anchor="middle">1</text></g><path d="M161 212 H278" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="229.5" y="159" class="d-seqlabel" text-anchor="middle">transfer(</text><text x="229.5" y="173" class="d-seqlabel" text-anchor="middle">account,</text><text x="229.5" y="187" class="d-seqlabel" text-anchor="middle">recipient,</text><text x="229.5" y="201" class="d-seqlabel" text-anchor="middle">amount)</text><g class="d-badge"><circle cx="183" cy="155" r="8"/><text x="183" y="158.5" text-anchor="middle">2</text></g><path d="M278 330 H161" class="d-edge d-dashed" marker-end="url(#transfer-checks-n-a)"/><text x="229.5" y="305" class="d-seqlabel" text-anchor="middle">Password</text><text x="229.5" y="319" class="d-seqlabel" text-anchor="middle">required</text><g class="d-badge"><circle cx="189.5" cy="301" r="8"/><text x="189.5" y="304.5" text-anchor="middle">3</text></g><path d="M157 386 H40" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="108.5" y="361" class="d-seqlabel" text-anchor="middle">Request</text><text x="108.5" y="375" class="d-seqlabel" text-anchor="middle">password</text><g class="d-badge"><circle cx="68.5" cy="357" r="8"/><text x="68.5" y="360.5" text-anchor="middle">4</text></g><path d="M40 442 H157" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="108.5" y="417" class="d-seqlabel" text-anchor="middle">Provide</text><text x="108.5" y="431" class="d-seqlabel" text-anchor="middle">password</text><g class="d-badge"><circle cx="68.5" cy="413" r="8"/><text x="68.5" y="416.5" text-anchor="middle">5</text></g><path d="M280 474 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="344" y="481" class="d-seqlabel">pending = amount</text><text x="344" y="495" class="d-seqlabel">+ maximum fee</text><g class="d-badge"><circle cx="332" cy="484" r="8"/><text x="332" y="487.5" text-anchor="middle">6</text></g><path d="M282 586 H393" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="347.5" y="533" class="d-seqlabel" text-anchor="middle">Query</text><text x="347.5" y="547" class="d-seqlabel" text-anchor="middle">balance</text><text x="347.5" y="561" class="d-seqlabel" text-anchor="middle">(explore-</text><text x="347.5" y="575" class="d-seqlabel" text-anchor="middle">deploy)</text><g class="d-badge"><circle cx="304" cy="529" r="8"/><text x="304" y="532.5" text-anchor="middle">7</text></g><path d="M393 628 H282" class="d-edge d-dashed" marker-end="url(#transfer-checks-n-a)"/><text x="347.5" y="617" class="d-seqlabel" text-anchor="middle">Balance</text><g class="d-badge"><circle cx="311" cy="613" r="8"/><text x="311" y="616.5" text-anchor="middle">8</text></g><path d="M280 648 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="344" y="648" class="d-seqlabel">Balance minus</text><text x="344" y="662" class="d-seqlabel">reserved funds</text><text x="344" y="676" class="d-seqlabel">covers pending?</text><g class="d-badge"><circle cx="332" cy="658" r="8"/><text x="332" y="661.5" text-anchor="middle">9</text></g></svg>
