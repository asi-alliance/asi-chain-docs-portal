<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 401 788" width="401" role="img" aria-labelledby="transfer-checks-n-t transfer-checks-n-d"><title id="transfer-checks-n-t">Check and reserve</title><desc id="transfer-checks-n-d">The user enters the recipient and amount in the wallet. The wallet calls transfer on the SDK client. If the session is locked or the policy asks for a password on every signature, the SDK asks the wallet for a password and the user provides it. The SDK computes pending as amount plus maximum fee, queries the balance from the read-only node through explore-deploy, and checks that the balance minus reserved funds covers pending.</desc><defs>
<marker id="transfer-checks-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="transfer-checks-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="38" y1="68" x2="38" y2="784" class="d-life"/><line x1="139" y1="68" x2="139" y2="784" class="d-life"/><line x1="246" y1="68" x2="246" y2="784" class="d-life"/><line x1="347" y1="68" x2="347" y2="784" class="d-life"/><g class="d-fragment"><rect x="10" y="270" width="264" height="224" rx="8"/><path d="M10 292h42v-22" class="d-fragline"/><text x="21" y="285" class="d-meta d-strong">opt</text><text x="64" y="285" class="d-meta">Session is locked or the</text><text x="64" y="298" class="d-meta">policy asks for a password on</text><text x="64" y="311" class="d-meta">every signature</text></g><g class="d-node d-external"><rect x="8" y="0" width="60" height="68" rx="10"/></g><text x="38" y="38.5" class="d-label" text-anchor="middle">User</text><g class="d-node d-service"><rect x="101.5" y="0" width="75" height="68" rx="10"/></g><text x="139" y="38.5" class="d-label" text-anchor="middle">Wallet</text><g class="d-node d-chain"><rect x="208.5" y="0" width="75" height="68" rx="10"/></g><text x="246" y="30.5" class="d-label" text-anchor="middle">SDK</text><text x="246" y="46.5" class="d-label" text-anchor="middle">Client</text><g class="d-node d-chain"><rect x="313.5" y="0" width="67" height="68" rx="10"/></g><text x="347" y="22.5" class="d-label" text-anchor="middle">Read-</text><text x="347" y="38.5" class="d-label" text-anchor="middle">only</text><text x="347" y="54.5" class="d-label" text-anchor="middle">node</text><path d="M40 158 H137" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="98.5" y="105" class="d-seqlabel" text-anchor="middle">Enter</text><text x="98.5" y="119" class="d-seqlabel" text-anchor="middle">recipient</text><text x="98.5" y="133" class="d-seqlabel" text-anchor="middle">and</text><text x="98.5" y="147" class="d-seqlabel" text-anchor="middle">amount</text><g class="d-badge"><circle cx="55" cy="101" r="8"/><text x="55" y="104.5" text-anchor="middle">1</text></g><path d="M141 242 H244" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="202.5" y="189" class="d-seqlabel" text-anchor="middle">transfer(</text><text x="202.5" y="203" class="d-seqlabel" text-anchor="middle">account,</text><text x="202.5" y="217" class="d-seqlabel" text-anchor="middle">recipient,</text><text x="202.5" y="231" class="d-seqlabel" text-anchor="middle">amount)</text><g class="d-badge"><circle cx="156" cy="185" r="8"/><text x="156" y="188.5" text-anchor="middle">2</text></g><path d="M244 360 H141" class="d-edge d-dashed" marker-end="url(#transfer-checks-n-a)"/><text x="202.5" y="335" class="d-seqlabel" text-anchor="middle">Password</text><text x="202.5" y="349" class="d-seqlabel" text-anchor="middle">required</text><g class="d-badge"><circle cx="162.5" cy="331" r="8"/><text x="162.5" y="334.5" text-anchor="middle">3</text></g><path d="M137 416 H40" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="98.5" y="391" class="d-seqlabel" text-anchor="middle">Request</text><text x="98.5" y="405" class="d-seqlabel" text-anchor="middle">password</text><g class="d-badge"><circle cx="58.5" cy="387" r="8"/><text x="58.5" y="390.5" text-anchor="middle">4</text></g><path d="M40 472 H137" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="98.5" y="447" class="d-seqlabel" text-anchor="middle">Provide</text><text x="98.5" y="461" class="d-seqlabel" text-anchor="middle">password</text><g class="d-badge"><circle cx="58.5" cy="443" r="8"/><text x="58.5" y="446.5" text-anchor="middle">5</text></g><path d="M246 521 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="310" y="521" class="d-seqlabel">pending =</text><text x="310" y="535" class="d-seqlabel">amount +</text><text x="310" y="549" class="d-seqlabel">maximum fee</text><g class="d-badge"><circle cx="298" cy="531" r="8"/><text x="298" y="534.5" text-anchor="middle">6</text></g><path d="M248 630 H345" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="306.5" y="577" class="d-seqlabel" text-anchor="middle">Query</text><text x="306.5" y="591" class="d-seqlabel" text-anchor="middle">balance</text><text x="306.5" y="605" class="d-seqlabel" text-anchor="middle">(explore-</text><text x="306.5" y="619" class="d-seqlabel" text-anchor="middle">deploy)</text><g class="d-badge"><circle cx="263" cy="573" r="8"/><text x="263" y="576.5" text-anchor="middle">7</text></g><path d="M345 672 H248" class="d-edge d-dashed" marker-end="url(#transfer-checks-n-a)"/><text x="306.5" y="661" class="d-seqlabel" text-anchor="middle">Balance</text><g class="d-badge"><circle cx="270" cy="657" r="8"/><text x="270" y="660.5" text-anchor="middle">8</text></g><path d="M246 723 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-n-a)"/><text x="310" y="709" class="d-seqlabel">Balance</text><text x="310" y="723" class="d-seqlabel">minus</text><text x="310" y="737" class="d-seqlabel">reserved</text><text x="310" y="751" class="d-seqlabel">funds covers</text><text x="310" y="765" class="d-seqlabel">pending?</text><g class="d-badge"><circle cx="298" cy="733" r="8"/><text x="298" y="736.5" text-anchor="middle">9</text></g></svg>
