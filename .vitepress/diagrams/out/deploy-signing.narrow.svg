<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 210 556" width="210" role="img" aria-labelledby="deploy-signing-n-t deploy-signing-n-d"><title id="deploy-signing-n-t">Deploy signing</title><desc id="deploy-signing-n-d">The SDK validates the recipient address and the amount and builds the transfer term for the node profile. It asks the read-only node for the latest block number, sets validAfterBlockNumber to that number minus 1, serializes the deploy fields, hashes them with blake2b and signs the hash with secp256k1.</desc><defs>
<marker id="deploy-signing-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="deploy-signing-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="40.5" y1="68" x2="40.5" y2="552" class="d-life"/><line x1="126.5" y1="68" x2="126.5" y2="552" class="d-life"/><g class="d-node d-chain"><rect x="8" y="0" width="65" height="68" rx="10"/></g><text x="40.5" y="30.5" class="d-label" text-anchor="middle">SDK</text><text x="40.5" y="46.5" class="d-label" text-anchor="middle">Client</text><g class="d-node d-chain"><rect x="98" y="0" width="57" height="68" rx="10"/></g><text x="126.5" y="22.5" class="d-label" text-anchor="middle">Read-</text><text x="126.5" y="38.5" class="d-label" text-anchor="middle">only</text><text x="126.5" y="54.5" class="d-label" text-anchor="middle">node</text><path d="M40.5 128 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-n-a)"/><text x="98" y="105" class="d-seqlabel" text-anchor="middle">Validate the recipient</text><text x="98" y="119" class="d-seqlabel" text-anchor="middle">address and the amount</text><g class="d-badge"><circle cx="8" cy="101" r="8"/><text x="8" y="104.5" text-anchor="middle">1</text></g><path d="M40.5 194 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-n-a)"/><text x="101.5" y="171" class="d-seqlabel" text-anchor="middle">Build the transfer term</text><text x="101.5" y="185" class="d-seqlabel" text-anchor="middle">for the node profile</text><g class="d-badge"><circle cx="8" cy="167" r="8"/><text x="8" y="170.5" text-anchor="middle">2</text></g><path d="M42.5 262 H124.5" class="d-edge" marker-end="url(#deploy-signing-n-a)"/><text x="93.5" y="237" class="d-seqlabel" text-anchor="middle">GET</text><text x="93.5" y="251" class="d-seqlabel" text-anchor="middle">/api/blocks</text><g class="d-badge"><circle cx="43.5" cy="233" r="8"/><text x="43.5" y="236.5" text-anchor="middle">3</text></g><path d="M124.5 332 H42.5" class="d-edge d-dashed" marker-end="url(#deploy-signing-n-a)"/><text x="93.5" y="293" class="d-seqlabel" text-anchor="middle">Latest</text><text x="93.5" y="307" class="d-seqlabel" text-anchor="middle">block</text><text x="93.5" y="321" class="d-seqlabel" text-anchor="middle">number</text><g class="d-badge"><circle cx="60.5" cy="289" r="8"/><text x="60.5" y="292.5" text-anchor="middle">4</text></g><path d="M40.5 386 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-n-a)"/><text x="101.5" y="363" class="d-seqlabel" text-anchor="middle">validAfterBlockNumber =</text><text x="101.5" y="377" class="d-seqlabel" text-anchor="middle">latest - 1</text><g class="d-badge"><circle cx="8" cy="359" r="8"/><text x="8" y="362.5" text-anchor="middle">5</text></g><path d="M40.5 452 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-n-a)"/><text x="91" y="429" class="d-seqlabel" text-anchor="middle">Serialize the deploy</text><text x="91" y="443" class="d-seqlabel" text-anchor="middle">fields</text><g class="d-badge"><circle cx="8" cy="425" r="8"/><text x="8" y="428.5" text-anchor="middle">6</text></g><path d="M40.5 518 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-signing-n-a)"/><text x="112" y="495" class="d-seqlabel" text-anchor="middle">Hash with blake2b and sign</text><text x="112" y="509" class="d-seqlabel" text-anchor="middle">with secp256k1</text><g class="d-badge"><circle cx="8" cy="491" r="8"/><text x="8" y="494.5" text-anchor="middle">7</text></g></svg>
