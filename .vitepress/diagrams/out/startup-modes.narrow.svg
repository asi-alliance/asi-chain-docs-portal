<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 366 670" width="366" role="img" aria-labelledby="startup-modes-n-t startup-modes-n-d"><title id="startup-modes-n-t">Launch modes</title><desc id="startup-modes-n-d">After launch the node picks one of four modes. With an approved block in storage it reconnects by building Casper from storage and goes to Running. With no approved block and genesis validator mode it signs the candidate genesis block and goes to Initializing. With no approved block and ceremony master mode it collects approvals, the genesis block is approved, and it goes to Running. With no approved block and no ceremony mode it joins an existing network, imports the state from the network in Initializing and goes to Running.</desc><defs>
<marker id="startup-modes-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="startup-modes-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(132.8 4)"><path d="M100.5 40 L100.5 76" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M52.5 96 L-120.8 96 Q-128.8 96 -128.8 104 L-128.8 165 Q-128.8 173 -120.8 173 L0 173" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M52.5 96 L-120.8 96 Q-128.8 96 -128.8 104 L-128.8 256 Q-128.8 264 -120.8 264 L16.5 264" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M52.5 96 L-120.8 96 Q-128.8 96 -128.8 104 L-128.8 354 Q-128.8 362 -120.8 362 L20 362" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M52.5 96 L-120.8 96 Q-128.8 96 -128.8 104 L-128.8 452 Q-128.8 460 -120.8 460 L19.5 460" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M100.5 396 L100.5 426" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M201 173 L221 173 Q229 173 229 181 L229 536 Q229 544 221 544 L150 544" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M184.5 264 L221 264 Q229 264 229 272 L229 536 Q229 544 221 544 L150 544" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M100.5 494 L100.5 524" class="d-edge" marker-end="url(#startup-modes-n-a)"/><path d="M100.5 564 L100.5 594" class="d-edge" marker-end="url(#startup-modes-n-a)"/><g class="d-node d-terminal"><rect x="52.5" y="0" width="96" height="40" rx="20"/></g><text x="100.5" y="24" class="d-label" text-anchor="middle">Start</text><g class="d-node d-service"><rect x="52.5" y="76" width="96" height="40" rx="10"/></g><text x="100.5" y="100" class="d-label" text-anchor="middle">Launch</text><g class="d-node d-service"><rect x="0" y="146" width="201" height="54" rx="10"/></g><text x="100.5" y="170" class="d-label" text-anchor="middle">Reconnect</text><text x="100.5" y="185" class="d-meta" text-anchor="middle">build Casper from storage</text><g class="d-node d-service"><rect x="16.5" y="230" width="168" height="68" rx="10"/></g><text x="100.5" y="254" class="d-label" text-anchor="middle">CeremonyMaster</text><text x="100.5" y="269" class="d-meta" text-anchor="middle">approvals collected,</text><text x="100.5" y="283" class="d-meta" text-anchor="middle">genesis approved</text><g class="d-node d-service"><rect x="20" y="328" width="161" height="68" rx="10"/></g><text x="100.5" y="352" class="d-label" text-anchor="middle">GenesisValidator</text><text x="100.5" y="367" class="d-meta" text-anchor="middle">candidate genesis</text><text x="100.5" y="381" class="d-meta" text-anchor="middle">block signed</text><g class="d-node d-service"><rect x="19.5" y="426" width="162" height="68" rx="10"/></g><text x="100.5" y="450" class="d-label" text-anchor="middle">Initializing</text><text x="100.5" y="465" class="d-meta" text-anchor="middle">state imported from</text><text x="100.5" y="479" class="d-meta" text-anchor="middle">the network</text><g class="d-node d-terminal"><rect x="51" y="524" width="99" height="40" rx="20"/></g><text x="100.5" y="548" class="d-label" text-anchor="middle">Running</text><g class="d-node d-terminal"><rect x="52.5" y="594" width="96" height="40" rx="20"/></g><text x="100.5" y="618" class="d-label" text-anchor="middle">End</text><rect x="-117.9" y="159" width="107" height="30" rx="4" class="d-chip"/><rect x="-121.4" y="243" width="114" height="44" rx="4" class="d-chip"/><rect x="-117.9" y="341" width="107" height="44" rx="4" class="d-chip"/><rect x="-124.9" y="439" width="121" height="44" rx="4" class="d-chip"/><text x="-64.4" y="170" class="d-elabel" text-anchor="middle">approved block</text><text x="-64.4" y="184" class="d-elabel" text-anchor="middle">in storage</text><text x="-64.4" y="254" class="d-elabel" text-anchor="middle">no approved</text><text x="-64.4" y="268" class="d-elabel" text-anchor="middle">block, ceremony</text><text x="-64.4" y="282" class="d-elabel" text-anchor="middle">master mode</text><text x="-64.4" y="352" class="d-elabel" text-anchor="middle">no approved</text><text x="-64.4" y="366" class="d-elabel" text-anchor="middle">block, genesis</text><text x="-64.4" y="380" class="d-elabel" text-anchor="middle">validator mode</text><text x="-64.4" y="450" class="d-elabel" text-anchor="middle">no approved</text><text x="-64.4" y="464" class="d-elabel" text-anchor="middle">block, join an</text><text x="-64.4" y="478" class="d-elabel" text-anchor="middle">existing network</text></g><g class="d-node d-service"><rect x="4" y="650" width="22" height="14" rx="4"/></g><text x="34" y="661" class="d-meta">Launch mode</text><g class="d-node d-terminal"><rect x="125" y="650" width="22" height="14" rx="7"/></g><text x="155" y="661" class="d-meta">Start, end or Running</text></svg>
