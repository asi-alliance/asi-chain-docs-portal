<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 332 566" width="332" role="img" aria-labelledby="architecture-overview-n-t architecture-overview-n-d"><title id="architecture-overview-n-t">Architecture overview</title><desc id="architecture-overview-n-d">The web wallet and SDK call the node over HTTP, and the Wallet CLI and the faucet API call it over gRPC or HTTP. The faucet frontend calls the faucet API. The Python indexer reads the node over gRPC or HTTP and writes to PostgreSQL. Hasura reads PostgreSQL and serves GraphQL to the explorer frontend and the web wallet.</desc><defs>
