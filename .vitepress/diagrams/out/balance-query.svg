<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 737 508" width="737" role="img" aria-labelledby="balance-query-w-t balance-query-w-d"><title id="balance-query-w-t">Balance query</title><desc id="balance-query-w-d">The wallet page asks the SDK client for the balance of an account. The SDK validates the address, builds the Rholang term for the node profile and posts it to the explore-deploy endpoint of the read-only node. The node runs the term on the last finalized state and returns a result expression. The SDK reads it as an atomic amount and returns the balance. The wallet page subtracts the reserved funds, converts the amount to ASI and displays it.</desc><defs>
<marker id="balance-query-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="balance-query-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="65" y1="36" x2="65" y2="504" class="d-life"/><line x1="275" y1="36" x2="275" y2="504" class="d-life"/><line x1="499" y1="36" x2="499" y2="504" class="d-life"/><g class="d-node d-service"><rect x="8" y="0" width="114" height="36" rx="10"/></g><text x="65" y="22.5" class="d-label" text-anchor="middle">Wallet page</text><g class="d-node d-chain"><rect x="222" y="0" width="106" height="36" rx="10"/></g><text x="275" y="22.5" class="d-label" text-anchor="middle">SDK Client</text><g class="d-node d-chain"><rect x="430" y="0" width="138" height="36" rx="10"/></g><text x="499" y="22.5" class="d-label" text-anchor="middle">Read-only node</text><path d="M67 84 H273" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="180" y="73" class="d-seqlabel" text-anchor="middle">Balance of the account</text><g class="d-badge"><circle cx="92" cy="69" r="8"/><text x="92" y="72.5" text-anchor="middle">1</text></g><path d="M275 110 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="339" y="124" class="d-seqlabel">Validate the address</text><g class="d-badge"><circle cx="327" cy="120" r="8"/><text x="327" y="123.5" text-anchor="middle">2</text></g><path d="M275 154 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="339" y="161" class="d-seqlabel">Build the Rholang term</text><text x="339" y="175" class="d-seqlabel">for the node profile</text><g class="d-badge"><circle cx="327" cy="164" r="8"/><text x="327" y="167.5" text-anchor="middle">3</text></g><path d="M277 214 H497" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="397" y="203" class="d-seqlabel" text-anchor="middle">POST /api/explore-deploy</text><g class="d-badge"><circle cx="302" cy="199" r="8"/><text x="302" y="202.5" text-anchor="middle">4</text></g><path d="M499 244 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="563" y="251" class="d-seqlabel">Run the term on the last</text><text x="563" y="265" class="d-seqlabel">finalized state</text><g class="d-badge"><circle cx="551" cy="254" r="8"/><text x="551" y="257.5" text-anchor="middle">5</text></g><path d="M497 304 H277" class="d-edge d-dashed" marker-end="url(#balance-query-w-a)"/><text x="397" y="293" class="d-seqlabel" text-anchor="middle">Result expression</text><g class="d-badge"><circle cx="326" cy="289" r="8"/><text x="326" y="292.5" text-anchor="middle">6</text></g><path d="M275 334 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="339" y="341" class="d-seqlabel">Read the result as an</text><text x="339" y="355" class="d-seqlabel">atomic amount</text><g class="d-badge"><circle cx="327" cy="344" r="8"/><text x="327" y="347.5" text-anchor="middle">7</text></g><path d="M273 394 H67" class="d-edge d-dashed" marker-end="url(#balance-query-w-a)"/><text x="180" y="383" class="d-seqlabel" text-anchor="middle">Balance</text><g class="d-badge"><circle cx="143.5" cy="379" r="8"/><text x="143.5" y="382.5" text-anchor="middle">8</text></g><path d="M65 420 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="129" y="434" class="d-seqlabel">Subtract reserved funds</text><g class="d-badge"><circle cx="117" cy="430" r="8"/><text x="117" y="433.5" text-anchor="middle">9</text></g><path d="M65 464 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="129" y="471" class="d-seqlabel">Convert to ASI and</text><text x="129" y="485" class="d-seqlabel">display</text><g class="d-badge"><circle cx="117" cy="474" r="8"/><text x="117" y="477.5" text-anchor="middle">10</text></g></svg>
