<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 697 530" width="697" role="img" aria-labelledby="balance-query-w-t balance-query-w-d"><title id="balance-query-w-t">Balance query</title><desc id="balance-query-w-d">The wallet page asks the SDK client for the balance of an account. The SDK validates the address, builds the Rholang term for the node profile and posts it to the explore-deploy endpoint of the read-only node. The node runs the term on the last finalized state and returns a result expression. The SDK reads it as an atomic amount and returns the balance. The wallet page subtracts the reserved funds, converts the amount to ASI and displays it.</desc><defs>
<marker id="balance-query-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="balance-query-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="65" y1="36" x2="65" y2="526" class="d-life"/><line x1="269" y1="36" x2="269" y2="526" class="d-life"/><line x1="487" y1="36" x2="487" y2="526" class="d-life"/><g class="d-node d-service"><rect x="8" y="0" width="114" height="36" rx="10"/></g><text x="65" y="22.5" class="d-label" text-anchor="middle">Wallet page</text><g class="d-node d-chain"><rect x="216" y="0" width="106" height="36" rx="10"/></g><text x="269" y="22.5" class="d-label" text-anchor="middle">SDK Client</text><g class="d-node d-chain"><rect x="418" y="0" width="138" height="36" rx="10"/></g><text x="487" y="22.5" class="d-label" text-anchor="middle">Read-only node</text><path d="M67 84 H267" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="177" y="73" class="d-seqlabel" text-anchor="middle">Balance of the account</text><g class="d-badge"><circle cx="89" cy="69" r="8"/><text x="89" y="72.5" text-anchor="middle">1</text></g><path d="M269 110 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="333" y="124" class="d-seqlabel">Validate the address</text><g class="d-badge"><circle cx="321" cy="120" r="8"/><text x="321" y="123.5" text-anchor="middle">2</text></g><path d="M269 161 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="333" y="161" class="d-seqlabel">Build the Rholang</text><text x="333" y="175" class="d-seqlabel">term for the node</text><text x="333" y="189" class="d-seqlabel">profile</text><g class="d-badge"><circle cx="321" cy="171" r="8"/><text x="321" y="174.5" text-anchor="middle">3</text></g><path d="M271 228 H485" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="388" y="217" class="d-seqlabel" text-anchor="middle">POST /api/explore-deploy</text><g class="d-badge"><circle cx="293" cy="213" r="8"/><text x="293" y="216.5" text-anchor="middle">4</text></g><path d="M487 258 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="551" y="265" class="d-seqlabel">Run the term on the</text><text x="551" y="279" class="d-seqlabel">last finalized state</text><g class="d-badge"><circle cx="539" cy="268" r="8"/><text x="539" y="271.5" text-anchor="middle">5</text></g><path d="M485 318 H271" class="d-edge d-dashed" marker-end="url(#balance-query-w-a)"/><text x="388" y="307" class="d-seqlabel" text-anchor="middle">Result expression</text><g class="d-badge"><circle cx="317" cy="303" r="8"/><text x="317" y="306.5" text-anchor="middle">6</text></g><path d="M269 348 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="333" y="355" class="d-seqlabel">Read the result as</text><text x="333" y="369" class="d-seqlabel">an atomic amount</text><g class="d-badge"><circle cx="321" cy="358" r="8"/><text x="321" y="361.5" text-anchor="middle">7</text></g><path d="M267 408 H67" class="d-edge d-dashed" marker-end="url(#balance-query-w-a)"/><text x="177" y="397" class="d-seqlabel" text-anchor="middle">Balance</text><g class="d-badge"><circle cx="140.5" cy="393" r="8"/><text x="140.5" y="396.5" text-anchor="middle">8</text></g><path d="M65 438 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="129" y="445" class="d-seqlabel">Subtract reserved</text><text x="129" y="459" class="d-seqlabel">funds</text><g class="d-badge"><circle cx="117" cy="448" r="8"/><text x="117" y="451.5" text-anchor="middle">9</text></g><path d="M65 486 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-w-a)"/><text x="129" y="493" class="d-seqlabel">Convert to ASI and</text><text x="129" y="507" class="d-seqlabel">display</text><g class="d-badge"><circle cx="117" cy="496" r="8"/><text x="117" y="499.5" text-anchor="middle">10</text></g></svg>
