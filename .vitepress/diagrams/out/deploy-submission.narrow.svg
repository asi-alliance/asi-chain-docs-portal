<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 325 671" width="325" role="img" aria-labelledby="deploy-submission-n-t deploy-submission-n-d"><title id="deploy-submission-n-t">Deploy submission</title><desc id="deploy-submission-n-d">The SDK saves the reservation in local storage and posts the signed deploy to the validator node. The node checks the signature, the price and the term. If it accepts the deploy it returns the deploy ID, and the wallet uses the signature as the deploy ID. If it refuses the deploy with a 4xx answer, the SDK releases the reservation. If the outcome is unknown, for example after a network error, the reservation stays.</desc><defs>
<marker id="deploy-submission-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="deploy-submission-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="40.5" y1="68" x2="40.5" y2="667" class="d-life"/><line x1="131" y1="68" x2="131" y2="667" class="d-life"/><line x1="233.5" y1="68" x2="233.5" y2="667" class="d-life"/><g class="d-fragment"><rect x="4.5" y="280" width="257" height="375" rx="8"/><path d="M4.5 302h42v-22" class="d-fragline"/><text x="15.5" y="295" class="d-meta d-strong">alt</text><text x="58.5" y="295" class="d-meta">The node accepts the deploy</text><path d="M4.5 413H261.5" class="d-fragline" stroke-dasharray="6 4"/><text x="15.5" y="428" class="d-meta">The node refuses with a 4xx</text><text x="15.5" y="441" class="d-meta">answer</text><path d="M4.5 546H261.5" class="d-fragline" stroke-dasharray="6 4"/><text x="15.5" y="561" class="d-meta">The outcome is unknown, for</text><text x="15.5" y="574" class="d-meta">example a network error</text></g><g class="d-node d-chain"><rect x="8" y="0" width="65" height="68" rx="10"/></g><text x="40.5" y="30.5" class="d-label" text-anchor="middle">SDK</text><text x="40.5" y="46.5" class="d-label" text-anchor="middle">Client</text><g class="d-node d-store"><rect x="79" y="0" width="104" height="68" rx="10"/></g><text x="131" y="22.5" class="d-label" text-anchor="middle">Local</text><text x="131" y="38.5" class="d-label" text-anchor="middle">storage</text><text x="131" y="54.5" class="d-label" text-anchor="middle">(IndexedDB)</text><g class="d-node d-chain"><rect x="189" y="0" width="89" height="68" rx="10"/></g><text x="233.5" y="30.5" class="d-label" text-anchor="middle">Validator</text><text x="233.5" y="46.5" class="d-label" text-anchor="middle">node</text><path d="M42.5 130 H129" class="d-edge" marker-end="url(#deploy-submission-n-a)"/><text x="95.75" y="105" class="d-seqlabel" text-anchor="middle">Save the</text><text x="95.75" y="119" class="d-seqlabel" text-anchor="middle">reservation</text><g class="d-badge"><circle cx="45.75" cy="101" r="8"/><text x="45.75" y="104.5" text-anchor="middle">1</text></g><path d="M42.5 186 H231.5" class="d-edge" marker-end="url(#deploy-submission-n-a)"/><text x="147" y="161" class="d-seqlabel" text-anchor="middle">POST</text><text x="147" y="175" class="d-seqlabel" text-anchor="middle">/api/deploy</text><g class="d-badge"><circle cx="97" cy="157" r="8"/><text x="97" y="160.5" text-anchor="middle">2</text></g><path d="M233.5 240 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-submission-n-a)"/><text x="233.5" y="217" class="d-seqlabel" text-anchor="middle">Check the signature, the</text><text x="233.5" y="231" class="d-seqlabel" text-anchor="middle">price and the term</text><g class="d-badge"><circle cx="136.5" cy="213" r="8"/><text x="136.5" y="216.5" text-anchor="middle">3</text></g><path d="M231.5 330 H42.5" class="d-edge d-dashed" marker-end="url(#deploy-submission-n-a)"/><text x="147" y="319" class="d-seqlabel" text-anchor="middle">Deploy ID</text><g class="d-badge"><circle cx="103.5" cy="315" r="8"/><text x="103.5" y="318.5" text-anchor="middle">4</text></g><g class="d-note"><rect x="12.5" y="350" width="146.5" height="53" rx="6"/><text x="85.75" y="366" class="d-meta d-notetext" text-anchor="middle">The wallet uses the</text><text x="85.75" y="379" class="d-meta d-notetext" text-anchor="middle">signature as the</text><text x="85.75" y="392" class="d-meta d-notetext" text-anchor="middle">deploy ID</text></g><path d="M231.5 468 H42.5" class="d-edge d-dashed" marker-end="url(#deploy-submission-n-a)"/><text x="147" y="457" class="d-seqlabel" text-anchor="middle">4xx answer</text><g class="d-badge"><circle cx="100.5" cy="453" r="8"/><text x="100.5" y="456.5" text-anchor="middle">5</text></g><path d="M42.5 524 H129" class="d-edge" marker-end="url(#deploy-submission-n-a)"/><text x="95.75" y="499" class="d-seqlabel" text-anchor="middle">Release the</text><text x="95.75" y="513" class="d-seqlabel" text-anchor="middle">reservation</text><g class="d-badge"><circle cx="45.75" cy="495" r="8"/><text x="45.75" y="498.5" text-anchor="middle">6</text></g><g class="d-note"><rect x="12.5" y="579" width="146.5" height="66" rx="6"/><text x="85.75" y="595" class="d-meta d-notetext" text-anchor="middle">The reservation</text><text x="85.75" y="608" class="d-meta d-notetext" text-anchor="middle">stays, because the</text><text x="85.75" y="621" class="d-meta d-notetext" text-anchor="middle">deploy may still</text><text x="85.75" y="634" class="d-meta d-notetext" text-anchor="middle">reach the network</text></g></svg>
