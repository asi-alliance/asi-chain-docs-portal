<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 312 782" width="312" role="img" aria-labelledby="wallet-layers-n-t wallet-layers-n-d"><title id="wallet-layers-n-t">Wallet layers</title><desc id="wallet-layers-n-d">In the browser wallet, pages use the Redux store and RTK Query, which call SdkWalletService. The service calls the SDK Client. The Client uses IndexedDB and ApiClientManager. ApiClientManager calls the validator node at ValidatorURL, the read-only node at ReadOnlyURL and the indexer at IndexerURL.</desc><defs>
<marker id="wallet-layers-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="wallet-layers-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(22 44)"><g class="d-group"><rect x="-18" y="-40" width="186" height="246" rx="14"/><text x="-2" y="-17" class="d-gtitle">ASI Wallet (browser)</text></g><g class="d-group"><rect x="-18" y="214" width="304" height="182" rx="14"/><text x="-2" y="237" class="d-gtitle">Wallet SDK</text></g><g class="d-group"><rect x="-18" y="404" width="186" height="280" rx="14"/><text x="-2" y="427" class="d-gtitle">Network</text></g><path d="M75 40 L75 66" class="d-edge" marker-end="url(#wallet-layers-n-a)"/><path d="M75 122 L75 148" class="d-edge" marker-end="url(#wallet-layers-n-a)"/><path d="M75 188 L75 261" class="d-edge" marker-end="url(#wallet-layers-n-a)"/><path d="M75 301 L75 338" class="d-edge" marker-end="url(#wallet-layers-n-a)"/><path d="M150 281 L168 281" class="d-edge" marker-end="url(#wallet-layers-n-a)"/><path d="M150 358 L154.5 358 Q159 358 159 362.5 L159 466.5 Q159 471 154.5 471 L150 471" class="d-edge" marker-end="url(#wallet-layers-n-a)"/><path d="M150 358 L154.5 358 Q159 358 159 362.5 L159 550.5 Q159 555 154.5 555 L150 555" class="d-edge" marker-end="url(#wallet-layers-n-a)"/><path d="M150 358 L154.5 358 Q159 358 159 362.5 L159 634.5 Q159 639 154.5 639 L150 639" class="d-edge" marker-end="url(#wallet-layers-n-a)"/><g class="d-node d-service"><rect x="0" y="0" width="150" height="40" rx="10"/></g><text x="75" y="24" class="d-label" text-anchor="middle">Pages (React)</text><g class="d-node d-service"><rect x="0" y="66" width="150" height="56" rx="10"/></g><text x="75" y="90" class="d-label" text-anchor="middle">Redux store</text><text x="75" y="106" class="d-label" text-anchor="middle">and RTK Query</text><g class="d-node d-service"><rect x="0" y="148" width="150" height="40" rx="10"/></g><text x="75" y="172" class="d-label" text-anchor="middle">SdkWalletService</text><g class="d-node d-chain"><rect x="0" y="338" width="150" height="40" rx="10"/></g><text x="75" y="362" class="d-label" text-anchor="middle">ApiClientManager</text><g class="d-node d-chain"><rect x="0" y="261" width="150" height="40" rx="10"/></g><text x="75" y="285" class="d-label" text-anchor="middle">Client</text><g class="d-node d-store"><path d="M168 261v40a50 7 0 0 0 100 0v-40a50 7 0 0 0 -100 0a50 7 0 0 0 100 0"/></g><text x="218" y="288" class="d-label" text-anchor="middle">IndexedDB</text><g class="d-node d-chain"><rect x="0" y="444" width="150" height="54" rx="10"/></g><text x="75" y="468" class="d-label" text-anchor="middle">Validator node</text><text x="75" y="483" class="d-meta" text-anchor="middle">(ValidatorURL)</text><g class="d-node d-chain"><rect x="0" y="528" width="150" height="54" rx="10"/></g><text x="75" y="552" class="d-label" text-anchor="middle">Read-only node</text><text x="75" y="567" class="d-meta" text-anchor="middle">(ReadOnlyURL)</text><g class="d-node d-service"><rect x="0" y="612" width="150" height="54" rx="10"/></g><text x="75" y="636" class="d-label" text-anchor="middle">Indexer</text><text x="75" y="651" class="d-meta" text-anchor="middle">(IndexerURL)</text></g><g class="d-node d-chain"><rect x="4" y="740" width="22" height="14" rx="4"/></g><text x="34" y="751" class="d-meta">Chain node</text><g class="d-node d-store"><path d="M118 743v8a11 3 0 0 0 22 0v-8a11 3 0 0 0-22 0a11 3 0 0 0 22 0"/></g><text x="148" y="751" class="d-meta">Data store</text><g class="d-node d-service"><rect x="4" y="762" width="22" height="14" rx="4"/></g><text x="34" y="773" class="d-meta">Service</text></svg>
