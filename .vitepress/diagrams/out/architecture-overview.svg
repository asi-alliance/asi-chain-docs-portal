<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 745 317" width="745" role="img" aria-labelledby="architecture-overview-w-t architecture-overview-w-d"><title id="architecture-overview-w-t">Architecture overview</title><desc id="architecture-overview-w-d">The web wallet and SDK call the node over HTTP, and the Wallet CLI and the faucet API call it over gRPC or HTTP. The faucet frontend calls the faucet API. The Python indexer reads the node over gRPC or HTTP and writes to PostgreSQL. Hasura reads PostgreSQL and serves GraphQL to the explorer frontend and the web wallet.</desc><defs>
