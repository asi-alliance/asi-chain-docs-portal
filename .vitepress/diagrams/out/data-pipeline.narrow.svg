<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 354 411" width="354" role="img" aria-labelledby="data-pipeline-n-t data-pipeline-n-d"><title id="data-pipeline-n-t">Data pipeline</title><desc id="data-pipeline-n-d">The Python indexer reads the node over gRPC and HTTP and writes indexed rows to PostgreSQL. Hasura serves authorized queries from PostgreSQL and returns GraphQL responses to the explorer frontend and to the wallet and SDK. The wallet and SDK also read the node directly over HTTP.</desc><defs>
<marker id="data-pipeline-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="data-pipeline-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 5)"><path d="M113 20 L200 20" class="d-edge" marker-end="url(#data-pipeline-n-a)"/><path d="M273 40 L273 96" class="d-edge" marker-end="url(#data-pipeline-n-a)"/><path d="M273 150 L273 206" class="d-edge" marker-end="url(#data-pipeline-n-a)"/><path d="M273 262 L273 318" class="d-edge" marker-end="url(#data-pipeline-n-a)"/><path d="M225 234 L130 234" class="d-edge" marker-end="url(#data-pipeline-n-a)"/><path d="M65 40 L65 214" class="d-edge" marker-end="url(#data-pipeline-n-a)"/><g class="d-node d-chain"><rect x="17" y="0" width="96" height="40" rx="10"/></g><text x="65" y="24" class="d-label" text-anchor="middle">Node</text><g class="d-node d-service"><rect x="200" y="0" width="146" height="40" rx="10"/></g><text x="273" y="24" class="d-label" text-anchor="middle">Python indexer</text><g class="d-node d-store"><path d="M216 103v40a57 7 0 0 0 114 0v-40a57 7 0 0 0 -114 0a57 7 0 0 0 114 0"/></g><text x="273" y="130" class="d-label" text-anchor="middle">PostgreSQL</text><g class="d-node d-service"><rect x="0" y="214" width="130" height="40" rx="10"/></g><text x="65" y="238" class="d-label" text-anchor="middle">Wallet / SDK</text><g class="d-node d-service"><rect x="225" y="206" width="96" height="56" rx="10"/></g><text x="273" y="230" class="d-label" text-anchor="middle">Hasura</text><text x="273" y="246" class="d-label" text-anchor="middle">GraphQL</text><g class="d-node d-service"><rect x="223.5" y="318" width="99" height="56" rx="10"/></g><text x="273" y="342" class="d-label" text-anchor="middle">Explorer</text><text x="273" y="358" class="d-label" text-anchor="middle">frontend</text><rect x="120" y="-1" width="73" height="44" rx="4" class="d-chip"/><rect x="226.5" y="61" width="93" height="16" rx="4" class="d-chip"/><rect x="205.5" y="171" width="135" height="16" rx="4" class="d-chip"/><rect x="209" y="283" width="128" height="16" rx="4" class="d-chip"/><rect x="141" y="220" width="73" height="30" rx="4" class="d-chip"/><rect x="11.5" y="116" width="107" height="16" rx="4" class="d-chip"/><text x="156.5" y="10" class="d-elabel" text-anchor="middle">gRPC /</text><text x="156.5" y="24" class="d-elabel" text-anchor="middle">HTTP</text><text x="156.5" y="38" class="d-elabel" text-anchor="middle">responses</text><text x="273" y="72" class="d-elabel" text-anchor="middle">indexed rows</text><text x="273" y="182" class="d-elabel" text-anchor="middle">authorized queries</text><text x="273" y="294" class="d-elabel" text-anchor="middle">GraphQL responses</text><text x="177.5" y="231" class="d-elabel" text-anchor="middle">GraphQL</text><text x="177.5" y="245" class="d-elabel" text-anchor="middle">responses</text><text x="65" y="127" class="d-elabel" text-anchor="middle">HTTP responses</text></g><g class="d-node d-chain"><rect x="4" y="391" width="22" height="14" rx="4"/></g><text x="34" y="402" class="d-meta">Chain node</text><g class="d-node d-store"><path d="M118 394v8a11 3 0 0 0 22 0v-8a11 3 0 0 0-22 0a11 3 0 0 0 22 0"/></g><text x="148" y="402" class="d-meta">Data store</text><g class="d-node d-service"><rect x="232" y="391" width="22" height="14" rx="4"/></g><text x="262" y="402" class="d-meta">Service</text></svg>
