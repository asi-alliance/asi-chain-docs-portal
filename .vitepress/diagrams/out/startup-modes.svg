<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 706 384" width="706" role="img" aria-labelledby="startup-modes-w-t startup-modes-w-d"><title id="startup-modes-w-t">Launch modes</title><desc id="startup-modes-w-d">After launch the node picks one of four modes. With an approved block in storage it reconnects by building Casper from storage and goes to Running. With no approved block and genesis validator mode it signs the candidate genesis block and goes to Initializing. With no approved block and ceremony master mode it collects approvals, the genesis block is approved, and it goes to Running. With no approved block and no ceremony mode it joins an existing network, imports the state from the network in Initializing and goes to Running.</desc><defs>
<marker id="startup-modes-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="startup-modes-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M48 47 L48 147" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M96 167 L117.6 167 Q125.6 167 125.6 159 L125.6 35 Q125.6 27 133.6 27 L244 27" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M96 167 L117.6 167 Q125.6 167 125.6 159 L125.6 126 Q125.6 118 133.6 118 L260.5 118" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M96 167 L117.6 167 Q125.6 167 125.6 175 L125.6 208 Q125.6 216 133.6 216 L264 216" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M96 167 L117.6 167 Q125.6 167 125.6 175 L125.6 306 Q125.6 314 133.6 314 L263.5 314" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M344.5 250 L344.5 280" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M445 27 L522.5 27 Q530.5 27 530.5 35 L530.5 147" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M428.5 118 L522.5 118 Q530.5 118 530.5 126 L530.5 147" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M425.5 314 L522.5 314 Q530.5 314 530.5 306 L530.5 187" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M580 167 L602 167" class="d-edge" marker-end="url(#startup-modes-w-a)"/><g class="d-node d-terminal"><rect x="0" y="7" width="96" height="40" rx="20"/></g><text x="48" y="31" class="d-label" text-anchor="middle">Start</text><g class="d-node d-service"><rect x="0" y="147" width="96" height="40" rx="10"/></g><text x="48" y="171" class="d-label" text-anchor="middle">Launch</text><g class="d-node d-service"><rect x="244" y="0" width="201" height="54" rx="10"/></g><text x="344.5" y="24" class="d-label" text-anchor="middle">Reconnect</text><text x="344.5" y="39" class="d-meta" text-anchor="middle">build Casper from storage</text><g class="d-node d-service"><rect x="260.5" y="84" width="168" height="68" rx="10"/></g><text x="344.5" y="108" class="d-label" text-anchor="middle">CeremonyMaster</text><text x="344.5" y="123" class="d-meta" text-anchor="middle">approvals collected,</text><text x="344.5" y="137" class="d-meta" text-anchor="middle">genesis approved</text><g class="d-node d-service"><rect x="264" y="182" width="161" height="68" rx="10"/></g><text x="344.5" y="206" class="d-label" text-anchor="middle">GenesisValidator</text><text x="344.5" y="221" class="d-meta" text-anchor="middle">candidate genesis</text><text x="344.5" y="235" class="d-meta" text-anchor="middle">block signed</text><g class="d-node d-service"><rect x="263.5" y="280" width="162" height="68" rx="10"/></g><text x="344.5" y="304" class="d-label" text-anchor="middle">Initializing</text><text x="344.5" y="319" class="d-meta" text-anchor="middle">state imported from</text><text x="344.5" y="333" class="d-meta" text-anchor="middle">the network</text><g class="d-node d-terminal"><rect x="481" y="147" width="99" height="40" rx="20"/></g><text x="530.5" y="171" class="d-label" text-anchor="middle">Running</text><g class="d-node d-terminal"><rect x="602" y="147" width="96" height="40" rx="20"/></g><text x="650" y="171" class="d-label" text-anchor="middle">End</text><rect x="134.26" y="13" width="107" height="30" rx="4" class="d-chip"/><rect x="130.76" y="97" width="114" height="44" rx="4" class="d-chip"/><rect x="134.26" y="195" width="107" height="44" rx="4" class="d-chip"/><rect x="127.26" y="293" width="121" height="44" rx="4" class="d-chip"/><text x="187.76" y="24" class="d-elabel" text-anchor="middle">approved block</text><text x="187.76" y="38" class="d-elabel" text-anchor="middle">in storage</text><text x="187.76" y="108" class="d-elabel" text-anchor="middle">no approved</text><text x="187.76" y="122" class="d-elabel" text-anchor="middle">block, ceremony</text><text x="187.76" y="136" class="d-elabel" text-anchor="middle">master mode</text><text x="187.76" y="206" class="d-elabel" text-anchor="middle">no approved</text><text x="187.76" y="220" class="d-elabel" text-anchor="middle">block, genesis</text><text x="187.76" y="234" class="d-elabel" text-anchor="middle">validator mode</text><text x="187.76" y="304" class="d-elabel" text-anchor="middle">no approved</text><text x="187.76" y="318" class="d-elabel" text-anchor="middle">block, join an</text><text x="187.76" y="332" class="d-elabel" text-anchor="middle">existing network</text></g><g class="d-node d-service"><rect x="4" y="364" width="22" height="14" rx="4"/></g><text x="34" y="375" class="d-meta">Launch mode</text><g class="d-node d-terminal"><rect x="125" y="364" width="22" height="14" rx="7"/></g><text x="155" y="375" class="d-meta">Start, end or Running</text></svg>
