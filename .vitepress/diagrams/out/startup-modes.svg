<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 780 384" width="780" role="img" aria-labelledby="startup-modes-w-t startup-modes-w-d"><title id="startup-modes-w-t">Launch modes</title><desc id="startup-modes-w-d">After launch the node picks one of four modes. With an approved block in storage it reconnects by building Casper from storage and goes to Running. With no approved block and genesis validator mode it signs the candidate genesis block and goes to Initializing. With no approved block and ceremony master mode it collects approvals, the genesis block is approved, and it goes to Running. With no approved block and no ceremony mode it joins an existing network, imports the state from the network in Initializing and goes to Running.</desc><defs>
<marker id="startup-modes-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="startup-modes-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M48 47 L48 147" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M96 167 L123.2 167 Q131.2 167 131.2 159 L131.2 35 Q131.2 27 139.2 27 L272 27" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M96 167 L123.2 167 Q131.2 167 131.2 159 L131.2 126 Q131.2 118 139.2 118 L288.5 118" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M96 167 L123.2 167 Q131.2 167 131.2 175 L131.2 208 Q131.2 216 139.2 216 L292 216" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M96 167 L123.2 167 Q131.2 167 131.2 175 L131.2 306 Q131.2 314 139.2 314 L291.5 314" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M372.5 250 L372.5 280" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M473 27 L578.5 27 Q586.5 27 586.5 35 L586.5 147" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M456.5 118 L578.5 118 Q586.5 118 586.5 126 L586.5 147" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M453.5 314 L578.5 314 Q586.5 314 586.5 306 L586.5 187" class="d-edge" marker-end="url(#startup-modes-w-a)"/><path d="M636 167 L676 167" class="d-edge" marker-end="url(#startup-modes-w-a)"/><g class="d-node d-terminal"><rect x="0" y="7" width="96" height="40" rx="20"/></g><text x="48" y="31" class="d-label" text-anchor="middle">Start</text><g class="d-node d-service"><rect x="0" y="147" width="96" height="40" rx="10"/></g><text x="48" y="171" class="d-label" text-anchor="middle">Launch</text><g class="d-node d-service"><rect x="272" y="0" width="201" height="54" rx="10"/></g><text x="372.5" y="24" class="d-label" text-anchor="middle">Reconnect</text><text x="372.5" y="39" class="d-meta" text-anchor="middle">build Casper from storage</text><g class="d-node d-service"><rect x="288.5" y="84" width="168" height="68" rx="10"/></g><text x="372.5" y="108" class="d-label" text-anchor="middle">CeremonyMaster</text><text x="372.5" y="123" class="d-meta" text-anchor="middle">approvals collected,</text><text x="372.5" y="137" class="d-meta" text-anchor="middle">genesis approved</text><g class="d-node d-service"><rect x="292" y="182" width="161" height="68" rx="10"/></g><text x="372.5" y="206" class="d-label" text-anchor="middle">GenesisValidator</text><text x="372.5" y="221" class="d-meta" text-anchor="middle">candidate genesis</text><text x="372.5" y="235" class="d-meta" text-anchor="middle">block signed</text><g class="d-node d-service"><rect x="291.5" y="280" width="162" height="68" rx="10"/></g><text x="372.5" y="304" class="d-label" text-anchor="middle">Initializing</text><text x="372.5" y="319" class="d-meta" text-anchor="middle">state imported from</text><text x="372.5" y="333" class="d-meta" text-anchor="middle">the network</text><g class="d-node d-terminal"><rect x="537" y="147" width="99" height="40" rx="20"/></g><text x="586.5" y="171" class="d-label" text-anchor="middle">Running</text><g class="d-node d-terminal"><rect x="676" y="147" width="96" height="40" rx="20"/></g><text x="724" y="171" class="d-label" text-anchor="middle">End</text><rect x="141.12" y="13" width="128" height="30" rx="4" class="d-chip"/><rect x="131.12" y="104" width="148" height="30" rx="4" class="d-chip"/><rect x="137.62" y="195" width="135" height="44" rx="4" class="d-chip"/><rect x="137.62" y="293" width="135" height="44" rx="4" class="d-chip"/><text x="205.12" y="24" class="d-elabel" text-anchor="middle">approved block in</text><text x="205.12" y="38" class="d-elabel" text-anchor="middle">storage</text><text x="205.12" y="115" class="d-elabel" text-anchor="middle">no approved block,</text><text x="205.12" y="129" class="d-elabel" text-anchor="middle">ceremony master mode</text><text x="205.12" y="206" class="d-elabel" text-anchor="middle">no approved block,</text><text x="205.12" y="220" class="d-elabel" text-anchor="middle">genesis validator</text><text x="205.12" y="234" class="d-elabel" text-anchor="middle">mode</text><text x="205.12" y="304" class="d-elabel" text-anchor="middle">no approved block,</text><text x="205.12" y="318" class="d-elabel" text-anchor="middle">join an existing</text><text x="205.12" y="332" class="d-elabel" text-anchor="middle">network</text></g><g class="d-node d-service"><rect x="4" y="364" width="22" height="14" rx="4"/></g><text x="34" y="375" class="d-meta">Launch mode</text><g class="d-node d-terminal"><rect x="125" y="364" width="22" height="14" rx="7"/></g><text x="155" y="375" class="d-meta">Start, end or Running</text></svg>
