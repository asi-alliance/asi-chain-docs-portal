<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 376 702" width="376" role="img" aria-labelledby="node-startup-n-t node-startup-n-d"><title id="node-startup-n-t">Node startup</title><desc id="node-startup-n-d">The node loads its configuration, keys and storage, chooses a launch mode, starts the transport, Kademlia, gRPC and HTTP servers, and starts the node discovery and clear-connections loops. A node that is not standalone waits for its first peer connection. Then it runs engine init and reaches the Running state. If engine init fails, the node shuts down.</desc><defs>
<marker id="node-startup-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="node-startup-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M232 56 L232 84" class="d-edge" marker-end="url(#node-startup-n-a)"/><path d="M232 124 L232 152" class="d-edge" marker-end="url(#node-startup-n-a)"/><path d="M232 224 L232 252" class="d-edge" marker-end="url(#node-startup-n-a)"/><path d="M232 340 L232 368" class="d-edge" marker-end="url(#node-startup-n-a)"/><path d="M232 414 L232 442" class="d-edge" marker-end="url(#node-startup-n-a)"/><path d="M307 391 L360 391 Q368 391 368 399 L368 554 Q368 562 360 562 L308.5 562" class="d-edge" marker-end="url(#node-startup-n-a)"/><path d="M232 498 L232 542" class="d-edge" marker-end="url(#node-startup-n-a)"/><path d="M232 582 L232 626" class="d-edge" marker-end="url(#node-startup-n-a)"/><path d="M155.5 562 L96 562" class="d-edge" marker-end="url(#node-startup-n-a)"/><g class="d-node d-service"><rect x="139.5" y="0" width="185" height="56" rx="10"/></g><text x="232" y="24" class="d-label" text-anchor="middle">Load configuration,</text><text x="232" y="40" class="d-label" text-anchor="middle">keys and storage</text><g class="d-node d-service"><rect x="143.5" y="84" width="177" height="40" rx="10"/></g><text x="232" y="108" class="d-label" text-anchor="middle">Choose launch mode</text><g class="d-node d-service"><rect x="136" y="152" width="192" height="72" rx="10"/></g><text x="232" y="176" class="d-label" text-anchor="middle">Start servers:</text><text x="232" y="192" class="d-label" text-anchor="middle">transport, Kademlia,</text><text x="232" y="208" class="d-label" text-anchor="middle">gRPC, HTTP</text><g class="d-node d-service"><rect x="136" y="252" width="192" height="88" rx="10"/></g><text x="232" y="276" class="d-label" text-anchor="middle">Start node discovery</text><text x="232" y="292" class="d-label" text-anchor="middle">and</text><text x="232" y="308" class="d-label" text-anchor="middle">clear-connections</text><text x="232" y="324" class="d-label" text-anchor="middle">loops</text><g class="d-node d-decision"><polygon points="157,391 175,368 289,368 307,391 289,414 175,414"/></g><text x="232" y="395" class="d-label" text-anchor="middle">Standalone?</text><g class="d-node d-service"><rect x="139.5" y="442" width="185" height="56" rx="10"/></g><text x="232" y="466" class="d-label" text-anchor="middle">Wait for first peer</text><text x="232" y="482" class="d-label" text-anchor="middle">connection</text><g class="d-node d-service"><rect x="155.5" y="542" width="153" height="40" rx="10"/></g><text x="232" y="566" class="d-label" text-anchor="middle">Run engine init</text><g class="d-node d-terminal"><rect x="182.5" y="626" width="99" height="40" rx="20"/></g><text x="232" y="650" class="d-label" text-anchor="middle">Running</text><g class="d-node d-terminal"><rect x="0" y="526" width="96" height="72" rx="36"/></g><text x="48" y="550" class="d-label" text-anchor="middle">Node</text><text x="48" y="566" class="d-label" text-anchor="middle">shuts</text><text x="48" y="582" class="d-label" text-anchor="middle">down</text><rect x="220" y="421" width="24" height="16" rx="4" class="d-chip"/><rect x="332.5" y="384" width="31" height="16" rx="4" class="d-chip"/><rect x="103.25" y="555" width="45" height="16" rx="4" class="d-chip"/><text x="232" y="432" class="d-elabel" text-anchor="middle">No</text><text x="348" y="395" class="d-elabel" text-anchor="middle">Yes</text><text x="125.75" y="566" class="d-elabel" text-anchor="middle">error</text></g><g class="d-node d-service"><rect x="4" y="682" width="22" height="14" rx="4"/></g><text x="34" y="693" class="d-meta">Service</text><g class="d-node d-decision"><polygon points="99,689 104,682 116,682 121,689 116,696 104,696"/></g><text x="129" y="693" class="d-meta">Decision</text><g class="d-node d-terminal"><rect x="200" y="682" width="22" height="14" rx="7"/></g><text x="230" y="693" class="d-meta">Start or end</text></svg>
