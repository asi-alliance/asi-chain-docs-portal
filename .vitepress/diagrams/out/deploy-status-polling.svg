<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 509 317" width="509" role="img" aria-labelledby="deploy-status-polling-w-t deploy-status-polling-w-d"><title id="deploy-status-polling-w-t">Deploy status polling</title><desc id="deploy-status-polling-w-d">Every 5 seconds, up to 180 seconds, the SDK asks the read-only node for the deploy and receives deploy info or an error. Then the SDK tells the wallet that the deploy is finalized, failed or timed out, and the wallet refreshes the balance and the history.</desc><defs>
<marker id="deploy-status-polling-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="deploy-status-polling-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="45.5" y1="36" x2="45.5" y2="313" class="d-life"/><line x1="235.5" y1="36" x2="235.5" y2="313" class="d-life"/><line x1="431.5" y1="36" x2="431.5" y2="313" class="d-life"/><g class="d-fragment"><rect x="207.5" y="70" width="252" height="127" rx="8"/><path d="M207.5 92h49v-22" class="d-fragline"/><text x="218.5" y="85" class="d-meta d-strong">loop</text><text x="268.5" y="85" class="d-meta">Every 5 seconds, up to 180</text><text x="268.5" y="98" class="d-meta">seconds</text></g><g class="d-node d-service"><rect x="8" y="0" width="75" height="36" rx="10"/></g><text x="45.5" y="22.5" class="d-label" text-anchor="middle">Wallet</text><g class="d-node d-chain"><rect x="182.5" y="0" width="106" height="36" rx="10"/></g><text x="235.5" y="22.5" class="d-label" text-anchor="middle">SDK Client</text><g class="d-node d-chain"><rect x="362.5" y="0" width="138" height="36" rx="10"/></g><text x="431.5" y="22.5" class="d-label" text-anchor="middle">Read-only node</text><path d="M237.5 133 H429.5" class="d-edge" marker-end="url(#deploy-status-polling-w-a)"/><text x="343.5" y="122" class="d-seqlabel" text-anchor="middle">GET /api/deploy/{id}</text><g class="d-badge"><circle cx="262.5" cy="118" r="8"/><text x="262.5" y="121.5" text-anchor="middle">1</text></g><path d="M429.5 175 H237.5" class="d-edge d-dashed" marker-end="url(#deploy-status-polling-w-a)"/><text x="343.5" y="164" class="d-seqlabel" text-anchor="middle">Deploy info or error</text><g class="d-badge"><circle cx="262.5" cy="160" r="8"/><text x="262.5" y="163.5" text-anchor="middle">2</text></g><path d="M233.5 243 H47.5" class="d-edge d-dashed" marker-end="url(#deploy-status-polling-w-a)"/><text x="150.5" y="218" class="d-seqlabel" text-anchor="middle">Finalized, error or</text><text x="150.5" y="232" class="d-seqlabel" text-anchor="middle">timeout</text><g class="d-badge"><circle cx="72.5" cy="214" r="8"/><text x="72.5" y="217.5" text-anchor="middle">3</text></g><path d="M45.5 273 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-status-polling-w-a)"/><text x="109.5" y="280" class="d-seqlabel">Refresh balance and</text><text x="109.5" y="294" class="d-seqlabel">history</text><g class="d-badge"><circle cx="97.5" cy="283" r="8"/><text x="97.5" y="286.5" text-anchor="middle">4</text></g></svg>
