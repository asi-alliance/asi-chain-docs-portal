<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 767 392" width="767" role="img" aria-labelledby="network-topology-w-t network-topology-w-d"><title id="network-topology-w-t">Network topology</title><desc id="network-topology-w-d">Wallet, SDK, CLI and the faucet call the validator over HTTP 40403 and gRPC 40401. The bootstrap peer, validator and observer connect to each other over TCP 40400 and 40404. The indexer reads the validator and writes to PostgreSQL. Hasura reads PostgreSQL and serves GraphQL to the explorer, wallet, SDK and CLI.</desc><defs>
<marker id="network-topology-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="network-topology-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(22 44)"><g class="d-group"><rect x="-18" y="-32" width="166" height="340" rx="14"/><text x="-2" y="-9" class="d-gtitle">Clients</text></g><g class="d-group"><rect x="216" y="-40" width="525" height="126" rx="14"/><text x="232" y="-17" class="d-gtitle">Peer-to-peer network (TCP 40400, 40404)</text></g><g class="d-group"><rect x="236" y="202" width="503.5" height="114" rx="14"/><text x="252" y="225" class="d-gtitle">Data services</text></g><path d="M130 130 L254 130 Q262 130 262 122 L262 55" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M113 28 L234 28" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M673.5 250 L673.5 197.5 Q673.5 189.5 665.5 189.5 L310 189.5 Q302 189.5 302 181.5 L302 55" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M625.5 270 L554 270" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M350 270 L440 270" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M114.5 270 L254 270" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M130 158 L264 158 Q272 158 272 166 L272 242" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M443.5 28 L370 28" class="d-edge d-edge-strong" marker-end="url(#network-topology-w-ap)" marker-start="url(#network-topology-w-ap)"/><path d="M550.5 28 L624 28" class="d-edge d-edge-strong" marker-end="url(#network-topology-w-ap)" marker-start="url(#network-topology-w-ap)"/><path d="M342 55 L342 66 Q342 74 350 74 L665.5 74 Q673.5 74 673.5 66 L673.5 48" class="d-edge d-edge-strong" marker-end="url(#network-topology-w-ap)" marker-start="url(#network-topology-w-ap)"/><g class="d-node d-service"><rect x="17" y="8" width="96" height="40" rx="10"/></g><text x="65" y="32" class="d-label" text-anchor="middle">Faucet</text><g class="d-node d-service"><rect x="0" y="116" width="130" height="56" rx="10"/></g><text x="65" y="140" class="d-label" text-anchor="middle">Wallet, SDK,</text><text x="65" y="156" class="d-label" text-anchor="middle">CLI</text><g class="d-node d-service"><rect x="15.5" y="250" width="99" height="40" rx="10"/></g><text x="65" y="274" class="d-label" text-anchor="middle">Explorer</text><g class="d-node d-chain"><rect x="234" y="1" width="136" height="54" rx="10"/></g><text x="302" y="25" class="d-label" text-anchor="middle">Validator</text><text x="302" y="40" class="d-meta" text-anchor="middle">public entry point</text><g class="d-node d-chain"><rect x="443.5" y="0" width="107" height="56" rx="10"/></g><text x="497" y="24" class="d-label" text-anchor="middle">Bootstrap</text><text x="497" y="40" class="d-label" text-anchor="middle">peer</text><g class="d-node d-chain"><rect x="624" y="8" width="99" height="40" rx="10"/></g><text x="673.5" y="32" class="d-label" text-anchor="middle">Observer</text><g class="d-node d-service"><rect x="254" y="242" width="96" height="56" rx="10"/></g><text x="302" y="266" class="d-label" text-anchor="middle">Hasura</text><text x="302" y="282" class="d-label" text-anchor="middle">GraphQL</text><g class="d-node d-store"><path d="M440 250v40a57 7 0 0 0 114 0v-40a57 7 0 0 0 -114 0a57 7 0 0 0 114 0"/></g><text x="497" y="277" class="d-label" text-anchor="middle">PostgreSQL</text><g class="d-node d-service"><rect x="625.5" y="250" width="96" height="40" rx="10"/></g><text x="673.5" y="274" class="d-label" text-anchor="middle">Indexer</text><rect x="153" y="116" width="86" height="30" rx="4" class="d-chip"/><rect x="130.5" y="14" width="86" height="30" rx="4" class="d-chip"/><rect x="444.75" y="182.5" width="86" height="16" rx="4" class="d-chip"/><rect x="563.75" y="263" width="52" height="16" rx="4" class="d-chip"/><rect x="372.5" y="263" width="45" height="16" rx="4" class="d-chip"/><rect x="154.75" y="263" width="59" height="16" rx="4" class="d-chip"/><rect x="171.5" y="151" width="59" height="16" rx="4" class="d-chip"/><text x="196" y="127" class="d-elabel" text-anchor="middle">HTTP 40403,</text><text x="196" y="141" class="d-elabel" text-anchor="middle">gRPC 40401</text><text x="173.5" y="25" class="d-elabel" text-anchor="middle">HTTP 40403,</text><text x="173.5" y="39" class="d-elabel" text-anchor="middle">gRPC 40401</text><text x="487.75" y="193.5" class="d-elabel" text-anchor="middle">gRPC / HTTP</text><text x="589.75" y="274" class="d-elabel" text-anchor="middle">writes</text><text x="395" y="274" class="d-elabel" text-anchor="middle">reads</text><text x="184.25" y="274" class="d-elabel" text-anchor="middle">GraphQL</text><text x="201" y="162" class="d-elabel" text-anchor="middle">GraphQL</text></g><g class="d-node d-chain"><rect x="4" y="372" width="22" height="14" rx="4"/></g><text x="34" y="383" class="d-meta">Chain node</text><g class="d-node d-store"><rect x="118" y="372" width="22" height="14" rx="4"/></g><text x="148" y="383" class="d-meta">Data store</text><g class="d-node d-service"><rect x="232" y="372" width="22" height="14" rx="4"/></g><text x="262" y="383" class="d-meta">Service</text></svg>
