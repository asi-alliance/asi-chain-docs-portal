<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 708 392" width="708" role="img" aria-labelledby="network-topology-w-t network-topology-w-d"><title id="network-topology-w-t">Network topology</title><desc id="network-topology-w-d">Wallet, SDK, CLI and the faucet call the validator over HTTP 40403 and gRPC 40401. The bootstrap peer, validator and observer connect to each other over TCP 40400 and 40404. The indexer reads the validator and writes to PostgreSQL. Hasura reads PostgreSQL and serves GraphQL to the explorer, wallet, SDK and CLI.</desc><defs>
<marker id="network-topology-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="network-topology-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(22 44)"><g class="d-group"><rect x="-18" y="-32" width="135" height="340" rx="14"/><text x="-2" y="-9" class="d-gtitle">Clients</text></g><g class="d-group"><rect x="173" y="-40" width="509" height="126" rx="14"/><text x="189" y="-17" class="d-gtitle">Peer-to-peer network (TCP 40400, 40404)</text></g><g class="d-group"><rect x="193" y="202" width="487.5" height="114" rx="14"/><text x="209" y="225" class="d-gtitle">Data services</text></g><path d="M99 130 L211 130 Q219 130 219 122 L219 55" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M97.5 28 L191 28" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M614.5 250 L614.5 197.5 Q614.5 189.5 606.5 189.5 L267 189.5 Q259 189.5 259 181.5 L259 55" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M566.5 270 L503 270" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M307 270 L389 270" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M99 270 L211 270" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M99 158 L221 158 Q229 158 229 166 L229 242" class="d-edge" marker-end="url(#network-topology-w-a)"/><path d="M392.5 28 L327 28" class="d-edge d-edge-strong" marker-end="url(#network-topology-w-ap)" marker-start="url(#network-topology-w-ap)"/><path d="M499.5 28 L565 28" class="d-edge d-edge-strong" marker-end="url(#network-topology-w-ap)" marker-start="url(#network-topology-w-ap)"/><path d="M299 55 L299 66 Q299 74 307 74 L606.5 74 Q614.5 74 614.5 66 L614.5 48" class="d-edge d-edge-strong" marker-end="url(#network-topology-w-ap)" marker-start="url(#network-topology-w-ap)"/><g class="d-node d-service"><rect x="1.5" y="8" width="96" height="40" rx="10"/></g><text x="49.5" y="32" class="d-label" text-anchor="middle">Faucet</text><g class="d-node d-service"><rect x="0" y="116" width="99" height="56" rx="10"/></g><text x="49.5" y="140" class="d-label" text-anchor="middle">Wallet,</text><text x="49.5" y="156" class="d-label" text-anchor="middle">SDK, CLI</text><g class="d-node d-service"><rect x="0" y="250" width="99" height="40" rx="10"/></g><text x="49.5" y="274" class="d-label" text-anchor="middle">Explorer</text><g class="d-node d-chain"><rect x="191" y="1" width="136" height="54" rx="10"/></g><text x="259" y="25" class="d-label" text-anchor="middle">Validator</text><text x="259" y="40" class="d-meta" text-anchor="middle">entry point</text><g class="d-node d-chain"><rect x="392.5" y="0" width="107" height="56" rx="10"/></g><text x="446" y="24" class="d-label" text-anchor="middle">Bootstrap</text><text x="446" y="40" class="d-label" text-anchor="middle">peer</text><g class="d-node d-chain"><rect x="565" y="8" width="99" height="40" rx="10"/></g><text x="614.5" y="32" class="d-label" text-anchor="middle">Observer</text><g class="d-node d-service"><rect x="211" y="242" width="96" height="56" rx="10"/></g><text x="259" y="266" class="d-label" text-anchor="middle">Hasura</text><text x="259" y="282" class="d-label" text-anchor="middle">GraphQL</text><g class="d-node d-store"><path d="M389 250v40a57 7 0 0 0 114 0v-40a57 7 0 0 0 -114 0a57 7 0 0 0 114 0"/></g><text x="446" y="277" class="d-label" text-anchor="middle">PostgreSQL</text><g class="d-node d-service"><rect x="566.5" y="250" width="96" height="40" rx="10"/></g><text x="614.5" y="274" class="d-label" text-anchor="middle">Indexer</text><rect x="116" y="116" width="86" height="30" rx="4" class="d-chip"/><rect x="101.25" y="14" width="86" height="30" rx="4" class="d-chip"/><rect x="393.75" y="182.5" width="86" height="16" rx="4" class="d-chip"/><rect x="508.75" y="263" width="52" height="16" rx="4" class="d-chip"/><rect x="325.5" y="263" width="45" height="16" rx="4" class="d-chip"/><rect x="125.5" y="263" width="59" height="16" rx="4" class="d-chip"/><rect x="134.5" y="151" width="59" height="16" rx="4" class="d-chip"/><text x="159" y="127" class="d-elabel" text-anchor="middle">HTTP 40403,</text><text x="159" y="141" class="d-elabel" text-anchor="middle">gRPC 40401</text><text x="144.25" y="25" class="d-elabel" text-anchor="middle">HTTP 40403,</text><text x="144.25" y="39" class="d-elabel" text-anchor="middle">gRPC 40401</text><text x="436.75" y="193.5" class="d-elabel" text-anchor="middle">gRPC / HTTP</text><text x="534.75" y="274" class="d-elabel" text-anchor="middle">writes</text><text x="348" y="274" class="d-elabel" text-anchor="middle">reads</text><text x="155" y="274" class="d-elabel" text-anchor="middle">GraphQL</text><text x="164" y="162" class="d-elabel" text-anchor="middle">GraphQL</text></g><g class="d-node d-chain"><rect x="4" y="372" width="22" height="14" rx="4"/></g><text x="34" y="383" class="d-meta">Chain node</text><g class="d-node d-store"><path d="M118 375v8a11 3 0 0 0 22 0v-8a11 3 0 0 0-22 0a11 3 0 0 0 22 0"/></g><text x="148" y="383" class="d-meta">Data store</text><g class="d-node d-service"><rect x="232" y="372" width="22" height="14" rx="4"/></g><text x="262" y="383" class="d-meta">Service</text></svg>
