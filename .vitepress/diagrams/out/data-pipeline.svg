idth="135" height="16" rx="4" class="d-chip"/><rect x="489" y="188" width="128" height="16" rx="4" class="d-chip"/><rect x="253.5" y="135" width="128" height="16" rx="4" class="d-chip"/><rect x="11.5" y="77.5" width="107" height="16" rx="4" class="d-chip"/><text x="176.5" y="24" class="d-elabel" text-anchor="middle">gRPC / HTTP</text><text x="176.5" y="38" class="d-elabel" text-anchor="middle">responses</text><text x="441" y="31" class="d-elabel" text-anchor="middle">indexed rows</text><text x="553" y="88" class="d-elabel" text-anchor="middle">authorized queries</text><text x="553" y="199" class="d-elabel" text-anchor="middle">GraphQL responses</text><text x="317.5" y="146" class="d-elabel" text-anchor="middle">GraphQL responses</text><text x="65" y="88.5" class="d-elabel" text-anchor="middle">HTTP responses</text></g><g class="d-node d-chain"><rect x="4" y="292" width="22" height="14" rx="4"/></g><text x="34" y="303" class="d-meta">Chain node</text><g class="d-node d-store"><path d="M118 295v8a11 3 0 0 0 22 0v-8a11 3 0 0 0-22 0a11 3 0 0 0 22 0"/></g><text x="148" y="303" class="d-meta">Data store</text><g class="d-node d-service"><rect x="232" y="292" width="22" height="14" rx="4"/></g><text x="262" y="303" class="d-meta">Service</text></svg>
