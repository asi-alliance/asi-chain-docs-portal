<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 629 312" width="629" role="img" aria-labelledby="data-pipeline-w-t data-pipeline-w-d"><title id="data-pipeline-w-t">Data pipeline</title><desc id="data-pipeline-w-d">The Python indexer reads the node over gRPC and HTTP and writes indexed rows to PostgreSQL. Hasura serves authorized queries from PostgreSQL and returns GraphQL responses to the explorer frontend and to the wallet and SDK. The wallet and SDK also read the node directly over HTTP.</desc><defs>
