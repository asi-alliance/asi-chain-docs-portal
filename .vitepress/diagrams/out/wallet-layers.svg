<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 644 402" width="644" role="img" aria-labelledby="wallet-layers-w-t wallet-layers-w-d"><title id="wallet-layers-w-t">Wallet layers</title><desc id="wallet-layers-w-d">In the browser wallet, pages use the Redux store and RTK Query, which call SdkWalletService. The service calls the SDK Client. The Client uses IndexedDB and ApiClientManager. ApiClientManager calls the validator node at ValidatorURL, the read-only node at ReadOnlyURL and the indexer at IndexerURL.</desc><defs>
<marker id="wallet-layers-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="wallet-layers-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(22 44)"><g class="d-group"><rect x="-18" y="-33" width="186" height="268" rx="14"/><text x="-2" y="-10" class="d-gtitle">ASI Wallet (browser)</text></g><g class="d-group"><rect x="202" y="52" width="186" height="274" rx="14"/><text x="218" y="75" class="d-gtitle">Wallet SDK</text></g><g class="d-group"><rect x="432" y="-40" width="186" height="282" rx="14"/><text x="448" y="-17" class="d-gtitle">Network</text></g><path d="M75 47 L75 84" class="d-edge" marker-end="url(#wallet-layers-w-a)"/><path d="M75 140 L75 177" class="d-edge" marker-end="url(#wallet-layers-w-a)"/><path d="M150 197 L220 197" class="d-edge" marker-end="url(#wallet-layers-w-a)"/><path d="M295 177 L295 132" class="d-edge" marker-end="url(#wallet-layers-w-a)"/><path d="M295 217 L295 254" class="d-edge" marker-end="url(#wallet-layers-w-a)"/><path d="M370 112 L402 112 Q410 112 410 104 L410 35 Q410 27 418 27 L450 27" class="d-edge" marker-end="url(#wallet-layers-w-a)"/><path d="M370 112 L450 112" class="d-edge" marker-end="url(#wallet-layers-w-a)"/><path d="M370 112 L402 112 Q410 112 410 120 L410 189 Q410 197 418 197 L450 197" class="d-edge" marker-end="url(#wallet-layers-w-a)"/><g class="d-node d-service"><rect x="0" y="7" width="150" height="40" rx="10"/></g><text x="75" y="31" class="d-label" text-anchor="middle">Pages (React)</text><g class="d-node d-service"><rect x="0" y="84" width="150" height="56" rx="10"/></g><text x="75" y="108" class="d-label" text-anchor="middle">Redux store</text><text x="75" y="124" class="d-label" text-anchor="middle">and RTK Query</text><g class="d-node d-service"><rect x="0" y="177" width="150" height="40" rx="10"/></g><text x="75" y="201" class="d-label" text-anchor="middle">SdkWalletService</text><g class="d-node d-chain"><rect x="220" y="92" width="150" height="40" rx="10"/></g><text x="295" y="116" class="d-label" text-anchor="middle">ApiClientManager</text><g class="d-node d-chain"><rect x="220" y="177" width="150" height="40" rx="10"/></g><text x="295" y="201" class="d-label" text-anchor="middle">Client</text><g class="d-node d-store"><path d="M220 261v40a75 7 0 0 0 150 0v-40a75 7 0 0 0 -150 0a75 7 0 0 0 150 0"/></g><text x="295" y="288" class="d-label" text-anchor="middle">IndexedDB</text><g class="d-node d-chain"><rect x="450" y="0" width="150" height="54" rx="10"/></g><text x="525" y="24" class="d-label" text-anchor="middle">Validator node</text><text x="525" y="39" class="d-meta" text-anchor="middle">(ValidatorURL)</text><g class="d-node d-chain"><rect x="450" y="85" width="150" height="54" rx="10"/></g><text x="525" y="109" class="d-label" text-anchor="middle">Read-only node</text><text x="525" y="124" class="d-meta" text-anchor="middle">(ReadOnlyURL)</text><g class="d-node d-service"><rect x="450" y="170" width="150" height="54" rx="10"/></g><text x="525" y="194" class="d-label" text-anchor="middle">Indexer</text><text x="525" y="209" class="d-meta" text-anchor="middle">(IndexerURL)</text></g><g class="d-node d-chain"><rect x="4" y="382" width="22" height="14" rx="4"/></g><text x="34" y="393" class="d-meta">Chain node</text><g class="d-node d-store"><rect x="118" y="382" width="22" height="14" rx="4"/></g><text x="148" y="393" class="d-meta">Data store</text><g class="d-node d-service"><rect x="232" y="382" width="22" height="14" rx="4"/></g><text x="262" y="393" class="d-meta">Service</text></svg>
