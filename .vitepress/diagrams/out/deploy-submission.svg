<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 666 530" width="666" role="img" aria-labelledby="deploy-submission-w-t deploy-submission-w-d"><title id="deploy-submission-w-t">Deploy submission</title><desc id="deploy-submission-w-d">The SDK saves the reservation in local storage and posts the signed deploy to the validator node. The node checks the signature, the price and the term. If it accepts the deploy it returns the deploy ID, and the wallet uses the signature as the deploy ID. If it refuses the deploy with a 4xx answer, the SDK releases the reservation. If the outcome is unknown, for example after a network error, the reservation stays.</desc><defs>
<marker id="deploy-submission-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="deploy-submission-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="61" y1="52" x2="61" y2="526" class="d-life"/><line x1="278" y1="52" x2="278" y2="526" class="d-life"/><line x1="428" y1="52" x2="428" y2="526" class="d-life"/><g class="d-fragment"><rect x="25" y="218" width="431" height="296" rx="8"/><path d="M25 240h42v-22" class="d-fragline"/><text x="36" y="233" class="d-meta d-strong">alt</text><text x="79" y="233" class="d-meta">The node accepts the deploy</text><path d="M25 338H456" class="d-fragline" stroke-dasharray="6 4"/><text x="36" y="353" class="d-meta">The node refuses with a 4xx answer</text><path d="M25 444H456" class="d-fragline" stroke-dasharray="6 4"/><text x="36" y="459" class="d-meta">The outcome is unknown, for example a network error</text></g><g class="d-node d-chain"><rect x="8" y="0" width="106" height="52" rx="10"/></g><text x="61" y="30.5" class="d-label" text-anchor="middle">SDK Client</text><g class="d-node d-store"><rect x="213" y="0" width="130" height="52" rx="10"/></g><text x="278" y="22.5" class="d-label" text-anchor="middle">Local storage</text><text x="278" y="38.5" class="d-label" text-anchor="middle">(IndexedDB)</text><g class="d-node d-chain"><rect x="359" y="0" width="138" height="52" rx="10"/></g><text x="428" y="30.5" class="d-label" text-anchor="middle">Validator node</text><path d="M63 100 H276" class="d-edge" marker-end="url(#deploy-submission-w-a)"/><text x="179.5" y="89" class="d-seqlabel" text-anchor="middle">Save the reservation</text><g class="d-badge"><circle cx="98.5" cy="85" r="8"/><text x="98.5" y="88.5" text-anchor="middle">1</text></g><path d="M63 142 H426" class="d-edge" marker-end="url(#deploy-submission-w-a)"/><text x="254.5" y="131" class="d-seqlabel" text-anchor="middle">POST /api/deploy</text><g class="d-badge"><circle cx="187" cy="127" r="8"/><text x="187" y="130.5" text-anchor="middle">2</text></g><path d="M428 172 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#deploy-submission-w-a)"/><text x="492" y="179" class="d-seqlabel">Check the signature, the</text><text x="492" y="193" class="d-seqlabel">price and the term</text><g class="d-badge"><circle cx="480" cy="182" r="8"/><text x="480" y="185.5" text-anchor="middle">3</text></g><path d="M426 268 H63" class="d-edge d-dashed" marker-end="url(#deploy-submission-w-a)"/><text x="254.5" y="257" class="d-seqlabel" text-anchor="middle">Deploy ID</text><g class="d-badge"><circle cx="211" cy="253" r="8"/><text x="211" y="256.5" text-anchor="middle">4</text></g><g class="d-note"><rect x="33" y="288" width="273" height="40" rx="6"/><text x="169.5" y="304" class="d-meta d-notetext" text-anchor="middle">The wallet uses the signature as the</text><text x="169.5" y="317" class="d-meta d-notetext" text-anchor="middle">deploy ID</text></g><path d="M426 380 H63" class="d-edge d-dashed" marker-end="url(#deploy-submission-w-a)"/><text x="254.5" y="369" class="d-seqlabel" text-anchor="middle">4xx answer</text><g class="d-badge"><circle cx="208" cy="365" r="8"/><text x="208" y="368.5" text-anchor="middle">5</text></g><path d="M63 422 H276" class="d-edge" marker-end="url(#deploy-submission-w-a)"/><text x="179.5" y="411" class="d-seqlabel" text-anchor="middle">Release the reservation</text><g class="d-badge"><circle cx="88" cy="407" r="8"/><text x="88" y="410.5" text-anchor="middle">6</text></g><g class="d-note"><rect x="33" y="464" width="273" height="40" rx="6"/><text x="169.5" y="480" class="d-meta d-notetext" text-anchor="middle">The reservation stays, because the</text><text x="169.5" y="493" class="d-meta d-notetext" text-anchor="middle">deploy may still reach the network</text></g></svg>
