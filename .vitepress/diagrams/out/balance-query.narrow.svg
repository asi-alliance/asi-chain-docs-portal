<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 288 678" width="288" role="img" aria-labelledby="balance-query-n-t balance-query-n-d"><title id="balance-query-n-t">Balance query</title><desc id="balance-query-n-d">The wallet page asks the SDK client for the balance of an account. The SDK validates the address, builds the Rholang term for the node profile and posts it to the explore-deploy endpoint of the read-only node. The node runs the term on the last finalized state and returns a result expression. The SDK reads it as an atomic amount and returns the balance. The wallet page subtracts the reserved funds, converts the amount to ASI and displays it.</desc><defs>
<marker id="balance-query-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="balance-query-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="40.5" y1="68" x2="40.5" y2="674" class="d-life"/><line x1="126.5" y1="68" x2="126.5" y2="674" class="d-life"/><line x1="205.5" y1="68" x2="205.5" y2="674" class="d-life"/><g class="d-node d-service"><rect x="8" y="0" width="65" height="68" rx="10"/></g><text x="40.5" y="30.5" class="d-label" text-anchor="middle">Wallet</text><text x="40.5" y="46.5" class="d-label" text-anchor="middle">page</text><g class="d-node d-chain"><rect x="94" y="0" width="65" height="68" rx="10"/></g><text x="126.5" y="30.5" class="d-label" text-anchor="middle">SDK</text><text x="126.5" y="46.5" class="d-label" text-anchor="middle">Client</text><g class="d-node d-chain"><rect x="177" y="0" width="57" height="68" rx="10"/></g><text x="205.5" y="22.5" class="d-label" text-anchor="middle">Read-</text><text x="205.5" y="38.5" class="d-label" text-anchor="middle">only</text><text x="205.5" y="54.5" class="d-label" text-anchor="middle">node</text><path d="M42.5 130 H124.5" class="d-edge" marker-end="url(#balance-query-n-a)"/><text x="93.5" y="105" class="d-seqlabel" text-anchor="middle">Balance of</text><text x="93.5" y="119" class="d-seqlabel" text-anchor="middle">the account</text><g class="d-badge"><circle cx="43.5" cy="101" r="8"/><text x="43.5" y="104.5" text-anchor="middle">1</text></g><path d="M126.5 170 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-n-a)"/><text x="126.5" y="161" class="d-seqlabel" text-anchor="middle">Validate the address</text><g class="d-badge"><circle cx="43.5" cy="157" r="8"/><text x="43.5" y="160.5" text-anchor="middle">2</text></g><path d="M126.5 236 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-n-a)"/><text x="126.5" y="213" class="d-seqlabel" text-anchor="middle">Build the Rholang term for</text><text x="126.5" y="227" class="d-seqlabel" text-anchor="middle">the node profile</text><g class="d-badge"><circle cx="22.5" cy="209" r="8"/><text x="22.5" y="212.5" text-anchor="middle">3</text></g><path d="M128.5 318 H203.5" class="d-edge" marker-end="url(#balance-query-n-a)"/><text x="176" y="279" class="d-seqlabel" text-anchor="middle">POST /api/</text><text x="176" y="293" class="d-seqlabel" text-anchor="middle">explore-</text><text x="176" y="307" class="d-seqlabel" text-anchor="middle">deploy</text><g class="d-badge"><circle cx="129.5" cy="275" r="8"/><text x="129.5" y="278.5" text-anchor="middle">4</text></g><path d="M205.5 372 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-n-a)"/><text x="197" y="349" class="d-seqlabel" text-anchor="middle">Run the term on the last</text><text x="197" y="363" class="d-seqlabel" text-anchor="middle">finalized state</text><g class="d-badge"><circle cx="100" cy="345" r="8"/><text x="100" y="348.5" text-anchor="middle">5</text></g><path d="M203.5 440 H128.5" class="d-edge d-dashed" marker-end="url(#balance-query-n-a)"/><text x="176" y="415" class="d-seqlabel" text-anchor="middle">Result</text><text x="176" y="429" class="d-seqlabel" text-anchor="middle">expression</text><g class="d-badge"><circle cx="129.5" cy="411" r="8"/><text x="129.5" y="414.5" text-anchor="middle">6</text></g><path d="M126.5 494 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-n-a)"/><text x="126.5" y="471" class="d-seqlabel" text-anchor="middle">Read the result as an</text><text x="126.5" y="485" class="d-seqlabel" text-anchor="middle">atomic amount</text><g class="d-badge"><circle cx="40" cy="467" r="8"/><text x="40" y="470.5" text-anchor="middle">7</text></g><path d="M124.5 548 H42.5" class="d-edge d-dashed" marker-end="url(#balance-query-n-a)"/><text x="93.5" y="537" class="d-seqlabel" text-anchor="middle">Balance</text><g class="d-badge"><circle cx="57" cy="533" r="8"/><text x="57" y="536.5" text-anchor="middle">8</text></g><path d="M40.5 588 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-n-a)"/><text x="101.5" y="579" class="d-seqlabel" text-anchor="middle">Subtract reserved funds</text><g class="d-badge"><circle cx="8" cy="575" r="8"/><text x="8" y="578.5" text-anchor="middle">9</text></g><path d="M40.5 640 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#balance-query-n-a)"/><text x="112" y="631" class="d-seqlabel" text-anchor="middle">Convert to ASI and display</text><g class="d-badge"><circle cx="8" cy="627" r="8"/><text x="8" y="630.5" text-anchor="middle">10</text></g></svg>
