<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 705 547" width="705" role="img" aria-labelledby="transfer-checks-w-t transfer-checks-w-d"><title id="transfer-checks-w-t">Check and reserve</title><desc id="transfer-checks-w-d">The user enters the recipient and amount in the wallet. The wallet calls transfer on the SDK client. If the session is locked or the policy asks for a password on every signature, the SDK asks the wallet for a password and the user provides it. The SDK computes pending as amount plus maximum fee, queries the balance from the read-only node through explore-deploy, and checks that the balance minus reserved funds covers pending.</desc><defs>
<marker id="transfer-checks-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="transfer-checks-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="38" y1="36" x2="38" y2="543" class="d-life"/><line x1="276" y1="36" x2="276" y2="543" class="d-life"/><line x1="459" y1="36" x2="459" y2="543" class="d-life"/><line x1="628" y1="36" x2="628" y2="543" class="d-life"/><g class="d-fragment"><rect x="10" y="168" width="477" height="169" rx="8"/><path d="M10 190h42v-22" class="d-fragline"/><text x="21" y="183" class="d-meta d-strong">opt</text><text x="64" y="183" class="d-meta">Session is locked or the policy asks for a password on every</text><text x="64" y="196" class="d-meta">signature</text></g><g class="d-node d-external"><rect x="8" y="0" width="60" height="36" rx="10"/></g><text x="38" y="22.5" class="d-label" text-anchor="middle">User</text><g class="d-node d-service"><rect x="238.5" y="0" width="75" height="36" rx="10"/></g><text x="276" y="22.5" class="d-label" text-anchor="middle">Wallet</text><g class="d-node d-chain"><rect x="406" y="0" width="106" height="36" rx="10"/></g><text x="459" y="22.5" class="d-label" text-anchor="middle">SDK Client</text><g class="d-node d-chain"><rect x="559" y="0" width="138" height="36" rx="10"/></g><text x="628" y="22.5" class="d-label" text-anchor="middle">Read-only node</text><path d="M40 84 H274" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="167" y="73" class="d-seqlabel" text-anchor="middle">Enter recipient and amount</text><g class="d-badge"><circle cx="65" cy="69" r="8"/><text x="65" y="72.5" text-anchor="middle">1</text></g><path d="M278 140 H457" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="377.5" y="115" class="d-seqlabel" text-anchor="middle">transfer(account,</text><text x="377.5" y="129" class="d-seqlabel" text-anchor="middle">recipient, amount)</text><g class="d-badge"><circle cx="303" cy="111" r="8"/><text x="303" y="114.5" text-anchor="middle">2</text></g><path d="M457 231 H278" class="d-edge d-dashed" marker-end="url(#transfer-checks-w-a)"/><text x="377.5" y="220" class="d-seqlabel" text-anchor="middle">Password required</text><g class="d-badge"><circle cx="306.5" cy="216" r="8"/><text x="306.5" y="219.5" text-anchor="middle">3</text></g><path d="M274 273 H40" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="167" y="262" class="d-seqlabel" text-anchor="middle">Request password</text><g class="d-badge"><circle cx="99.5" cy="258" r="8"/><text x="99.5" y="261.5" text-anchor="middle">4</text></g><path d="M40 315 H274" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="167" y="304" class="d-seqlabel" text-anchor="middle">Provide password</text><g class="d-badge"><circle cx="99.5" cy="300" r="8"/><text x="99.5" y="303.5" text-anchor="middle">5</text></g><path d="M459 357 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="523" y="364" class="d-seqlabel">pending = amount +</text><text x="523" y="378" class="d-seqlabel">maximum fee</text><g class="d-badge"><circle cx="511" cy="367" r="8"/><text x="511" y="370.5" text-anchor="middle">6</text></g><path d="M461 431 H626" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="553.5" y="406" class="d-seqlabel" text-anchor="middle">Query balance</text><text x="553.5" y="420" class="d-seqlabel" text-anchor="middle">(explore-deploy)</text><g class="d-badge"><circle cx="486" cy="402" r="8"/><text x="486" y="405.5" text-anchor="middle">7</text></g><path d="M626 473 H461" class="d-edge d-dashed" marker-end="url(#transfer-checks-w-a)"/><text x="553.5" y="462" class="d-seqlabel" text-anchor="middle">Balance</text><g class="d-badge"><circle cx="517" cy="458" r="8"/><text x="517" y="461.5" text-anchor="middle">8</text></g><path d="M459 503 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="523" y="510" class="d-seqlabel">Balance minus reserved</text><text x="523" y="524" class="d-seqlabel">funds covers pending?</text><g class="d-badge"><circle cx="511" cy="513" r="8"/><text x="511" y="516.5" text-anchor="middle">9</text></g></svg>
