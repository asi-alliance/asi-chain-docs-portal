<svg xmlns="http://www.w3.org/2000/svg" class="dgm seq" viewBox="0 0 894 516" width="894" role="img" aria-labelledby="transfer-checks-w-t transfer-checks-w-d"><title id="transfer-checks-w-t">Check and reserve</title><desc id="transfer-checks-w-d">The user enters the recipient and amount in the wallet. The wallet calls transfer on the SDK client. If the session is locked or the policy asks for a password on every signature, the SDK asks the wallet for a password and the user provides it. The SDK computes pending as amount plus maximum fee, queries the balance from the read-only node through explore-deploy, and checks that the balance minus reserved funds covers pending.</desc><defs>
<marker id="transfer-checks-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="transfer-checks-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><line x1="38" y1="36" x2="38" y2="512" class="d-life"/><line x1="284" y1="36" x2="284" y2="512" class="d-life"/><line x1="544" y1="36" x2="544" y2="512" class="d-life"/><line x1="817" y1="36" x2="817" y2="512" class="d-life"/><g class="d-fragment"><rect x="10" y="168" width="562" height="156" rx="8"/><path d="M10 190h42v-22" class="d-fragline"/><text x="21" y="183" class="d-meta d-strong">opt</text><text x="64" y="183" class="d-meta">Session is locked or the policy asks for a password on every signature</text></g><g class="d-node d-external"><rect x="8" y="0" width="60" height="36" rx="10"/></g><text x="38" y="22.5" class="d-label" text-anchor="middle">User</text><g class="d-node d-service"><rect x="246.5" y="0" width="75" height="36" rx="10"/></g><text x="284" y="22.5" class="d-label" text-anchor="middle">Wallet</text><g class="d-node d-chain"><rect x="491" y="0" width="106" height="36" rx="10"/></g><text x="544" y="22.5" class="d-label" text-anchor="middle">SDK Client</text><g class="d-node d-chain"><rect x="748" y="0" width="138" height="36" rx="10"/></g><text x="817" y="22.5" class="d-label" text-anchor="middle">Read-only node</text><path d="M40 84 H282" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="171" y="73" class="d-seqlabel" text-anchor="middle">Enter recipient and amount</text><g class="d-badge"><circle cx="69" cy="69" r="8"/><text x="69" y="72.5" text-anchor="middle">1</text></g><path d="M286 140 H542" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="424" y="115" class="d-seqlabel" text-anchor="middle">transfer(account, recipient,</text><text x="424" y="129" class="d-seqlabel" text-anchor="middle">amount)</text><g class="d-badge"><circle cx="315" cy="111" r="8"/><text x="315" y="114.5" text-anchor="middle">2</text></g><path d="M542 218 H286" class="d-edge d-dashed" marker-end="url(#transfer-checks-w-a)"/><text x="424" y="207" class="d-seqlabel" text-anchor="middle">Password required</text><g class="d-badge"><circle cx="353" cy="203" r="8"/><text x="353" y="206.5" text-anchor="middle">3</text></g><path d="M282 260 H40" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="171" y="249" class="d-seqlabel" text-anchor="middle">Request password</text><g class="d-badge"><circle cx="103.5" cy="245" r="8"/><text x="103.5" y="248.5" text-anchor="middle">4</text></g><path d="M40 302 H282" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="171" y="291" class="d-seqlabel" text-anchor="middle">Provide password</text><g class="d-badge"><circle cx="103.5" cy="287" r="8"/><text x="103.5" y="290.5" text-anchor="middle">5</text></g><path d="M544 334 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="608" y="348" class="d-seqlabel">pending = amount + maximum fee</text><g class="d-badge"><circle cx="596" cy="344" r="8"/><text x="596" y="347.5" text-anchor="middle">6</text></g><path d="M546 400 H815" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="690.5" y="389" class="d-seqlabel" text-anchor="middle">Query balance (explore-deploy)</text><g class="d-badge"><circle cx="575" cy="385" r="8"/><text x="575" y="388.5" text-anchor="middle">7</text></g><path d="M815 442 H546" class="d-edge d-dashed" marker-end="url(#transfer-checks-w-a)"/><text x="690.5" y="431" class="d-seqlabel" text-anchor="middle">Balance</text><g class="d-badge"><circle cx="654" cy="427" r="8"/><text x="654" y="430.5" text-anchor="middle">8</text></g><path d="M544 462 h26 q8 0 8 8 v4 q0 8 -8 8 h-24" class="d-edge" marker-end="url(#transfer-checks-w-a)"/><text x="608" y="469" class="d-seqlabel">Balance minus reserved funds covers</text><text x="608" y="483" class="d-seqlabel">pending?</text><g class="d-badge"><circle cx="596" cy="472" r="8"/><text x="596" y="475.5" text-anchor="middle">9</text></g></svg>
