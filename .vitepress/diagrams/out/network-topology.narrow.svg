<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 569 624" width="569" role="img" aria-labelledby="network-topology-n-t network-topology-n-d"><title id="network-topology-n-t">Network topology</title><desc id="network-topology-n-d">Wallet, SDK, CLI and the faucet call the validator over HTTP 40403 and gRPC 40401. The bootstrap peer, validator and observer connect to each other over TCP 40400 and 40404. The indexer reads the validator and writes to PostgreSQL. Hasura reads PostgreSQL and serves GraphQL to the explorer, wallet, SDK and CLI.</desc><defs>
<marker id="network-topology-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="network-topology-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(22 44)"><g class="d-group"><rect x="-18" y="-33" width="135" height="357" rx="14"/><text x="-2" y="-10" class="d-gtitle">Clients</text></g><g class="d-group"><rect x="211" y="-40" width="331.28" height="284" rx="14"/><text x="227" y="-17" class="d-gtitle">Peer-to-peer network (TCP 40400, 40404)</text></g><g class="d-group"><rect x="-16.5" y="330" width="375.5" height="218" rx="14"/><text x="-0.5" y="353" class="d-gtitle">Data services</text></g><path d="M99 112 L130 112 Q138 112 138 104 L138 35 Q138 27 146 27 L229 27" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M97.5 11 L229 11" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M245 398 L211 398 Q203 398 203 390 L203 51 Q203 43 211 43 L229 43" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M293 418 L293 495 Q293 503 285 503 L221 503" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M49.5 426 L49.5 495 Q49.5 503 57.5 503 L107 503" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M49.5 306 L49.5 370" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M99 132 L162.5 132 Q170.5 132 170.5 140 L170.5 390 Q170.5 398 162.5 398 L97.5 398" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M293 94 L293 54" class="d-edge d-edge-strong" marker-end="url(#network-topology-n-ap)" marker-start="url(#network-topology-n-ap)"/><path d="M293 150 L293 186" class="d-edge d-edge-strong" marker-end="url(#network-topology-n-ap)" marker-start="url(#network-topology-n-ap)"/><path d="M357 27 L377 27 Q385 27 385 35 L385 198 Q385 206 377 206 L342.5 206" class="d-edge d-edge-strong" marker-end="url(#network-topology-n-ap)" marker-start="url(#network-topology-n-ap)"/><g class="d-node d-service"><rect x="1.5" y="7" width="96" height="40" rx="10"/></g><text x="49.5" y="31" class="d-label" text-anchor="middle">Faucet</text><g class="d-node d-service"><rect x="0" y="94" width="99" height="56" rx="10"/></g><text x="49.5" y="118" class="d-label" text-anchor="middle">Wallet,</text><text x="49.5" y="134" class="d-label" text-anchor="middle">SDK, CLI</text><g class="d-node d-service"><rect x="0" y="266" width="99" height="40" rx="10"/></g><text x="49.5" y="290" class="d-label" text-anchor="middle">Explorer</text><g class="d-node d-chain"><rect x="229" y="0" width="128" height="54" rx="10"/></g><text x="293" y="24" class="d-label" text-anchor="middle">Validator</text><text x="293" y="39" class="d-meta" text-anchor="middle">public entry point</text><g class="d-node d-chain"><rect x="239.5" y="94" width="107" height="56" rx="10"/></g><text x="293" y="118" class="d-label" text-anchor="middle">Bootstrap</text><text x="293" y="134" class="d-label" text-anchor="middle">peer</text><g class="d-node d-chain"><rect x="243.5" y="186" width="99" height="40" rx="10"/></g><text x="293" y="210" class="d-label" text-anchor="middle">Observer</text><g class="d-node d-service"><rect x="1.5" y="370" width="96" height="56" rx="10"/></g><text x="49.5" y="394" class="d-label" text-anchor="middle">Hasura</text><text x="49.5" y="410" class="d-label" text-anchor="middle">GraphQL</text><g class="d-node d-store"><path d="M107 483v40a57 7 0 0 0 114 0v-40a57 7 0 0 0 -114 0a57 7 0 0 0 114 0"/></g><text x="164" y="510" class="d-label" text-anchor="middle">PostgreSQL</text><g class="d-node d-service"><rect x="245" y="378" width="96" height="40" rx="10"/></g><text x="293" y="402" class="d-label" text-anchor="middle">Indexer</text><rect x="95" y="60" width="86" height="30" rx="4" class="d-chip"/><rect x="120.25" y="-3" width="86" height="30" rx="4" class="d-chip"/><rect x="177" y="272" width="52" height="30" rx="4" class="d-chip"/><rect x="267" y="453.5" width="52" height="16" rx="4" class="d-chip"/><rect x="27" y="457.5" width="45" height="16" rx="4" class="d-chip"/><rect x="20" y="318.2" width="59" height="16" rx="4" class="d-chip"/><rect x="141" y="199" width="59" height="16" rx="4" class="d-chip"/><text x="138" y="71" class="d-elabel" text-anchor="middle">HTTP 40403,</text><text x="138" y="85" class="d-elabel" text-anchor="middle">gRPC 40401</text><text x="163.25" y="8" class="d-elabel" text-anchor="middle">HTTP 40403,</text><text x="163.25" y="22" class="d-elabel" text-anchor="middle">gRPC 40401</text><text x="203" y="283" class="d-elabel" text-anchor="middle">gRPC /</text><text x="203" y="297" class="d-elabel" text-anchor="middle">HTTP</text><text x="293" y="464.5" class="d-elabel" text-anchor="middle">writes</text><text x="49.5" y="468.5" class="d-elabel" text-anchor="middle">reads</text><text x="49.5" y="329.2" class="d-elabel" text-anchor="middle">GraphQL</text><text x="170.5" y="210" class="d-elabel" text-anchor="middle">GraphQL</text></g><g class="d-node d-chain"><rect x="4" y="604" width="22" height="14" rx="4"/></g><text x="34" y="615" class="d-meta">Chain node</text><g class="d-node d-store"><rect x="118" y="604" width="22" height="14" rx="4"/></g><text x="148" y="615" class="d-meta">Data store</text><g class="d-node d-service"><rect x="232" y="604" width="22" height="14" rx="4"/></g><text x="262" y="615" class="d-meta">Service</text></svg>
