<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 397 638" width="397" role="img" aria-labelledby="network-topology-n-t network-topology-n-d"><title id="network-topology-n-t">Network topology</title><desc id="network-topology-n-d">Wallet, SDK, CLI and the faucet call the validator over HTTP 40403 and gRPC 40401. The bootstrap peer, validator and observer connect to each other over TCP 40400 and 40404. The indexer reads the validator and writes to PostgreSQL. Hasura reads PostgreSQL and serves GraphQL to the explorer, wallet, SDK and CLI.</desc><defs>
<marker id="network-topology-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="network-topology-n-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(22 58)"><g class="d-group"><rect x="-18" y="-33" width="135" height="357" rx="14"/><text x="-2" y="-10" class="d-gtitle">Clients</text></g><g class="d-group"><rect x="185" y="-54" width="185.12" height="298" rx="14"/><text x="201" y="-31" class="d-gtitle">Peer-to-peer network</text><text x="201" y="-16" class="d-meta">(TCP 40400, 40404)</text></g><g class="d-group"><rect x="-16.5" y="330" width="349.5" height="218" rx="14"/><text x="-0.5" y="353" class="d-gtitle">Data services</text></g><path d="M99 112 L111.8 112 Q119.8 112 119.8 104 L119.8 35 Q119.8 27 127.8 27 L203 27" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M97.5 11 L203 11" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M219 398 L190.2 398 Q182.2 398 182.2 390 L182.2 51 Q182.2 43 190.2 43 L203 43" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M267 418 L267 495 Q267 503 259 503 L208 503" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M49.5 426 L49.5 495 Q49.5 503 57.5 503 L94 503" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M49.5 306 L49.5 370" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M99 132 L137.8 132 Q145.8 132 145.8 140 L145.8 390 Q145.8 398 137.8 398 L97.5 398" class="d-edge" marker-end="url(#network-topology-n-a)"/><path d="M267 94 L267 54" class="d-edge d-edge-strong" marker-end="url(#network-topology-n-ap)" marker-start="url(#network-topology-n-ap)"/><path d="M267 150 L267 186" class="d-edge d-edge-strong" marker-end="url(#network-topology-n-ap)" marker-start="url(#network-topology-n-ap)"/><path d="M331 27 L351 27 Q359 27 359 35 L359 198 Q359 206 351 206 L316.5 206" class="d-edge d-edge-strong" marker-end="url(#network-topology-n-ap)" marker-start="url(#network-topology-n-ap)"/><g class="d-node d-service"><rect x="1.5" y="7" width="96" height="40" rx="10"/></g><text x="49.5" y="31" class="d-label" text-anchor="middle">Faucet</text><g class="d-node d-service"><rect x="0" y="94" width="99" height="56" rx="10"/></g><text x="49.5" y="118" class="d-label" text-anchor="middle">Wallet,</text><text x="49.5" y="134" class="d-label" text-anchor="middle">SDK, CLI</text><g class="d-node d-service"><rect x="0" y="266" width="99" height="40" rx="10"/></g><text x="49.5" y="290" class="d-label" text-anchor="middle">Explorer</text><g class="d-node d-chain"><rect x="203" y="0" width="128" height="54" rx="10"/></g><text x="267" y="24" class="d-label" text-anchor="middle">Validator</text><text x="267" y="39" class="d-meta" text-anchor="middle">entry point</text><g class="d-node d-chain"><rect x="213.5" y="94" width="107" height="56" rx="10"/></g><text x="267" y="118" class="d-label" text-anchor="middle">Bootstrap</text><text x="267" y="134" class="d-label" text-anchor="middle">peer</text><g class="d-node d-chain"><rect x="217.5" y="186" width="99" height="40" rx="10"/></g><text x="267" y="210" class="d-label" text-anchor="middle">Observer</text><g class="d-node d-service"><rect x="1.5" y="370" width="96" height="56" rx="10"/></g><text x="49.5" y="394" class="d-label" text-anchor="middle">Hasura</text><text x="49.5" y="410" class="d-label" text-anchor="middle">GraphQL</text><g class="d-node d-store"><path d="M94 483v40a57 7 0 0 0 114 0v-40a57 7 0 0 0 -114 0a57 7 0 0 0 114 0"/></g><text x="151" y="510" class="d-label" text-anchor="middle">PostgreSQL</text><g class="d-node d-service"><rect x="219" y="378" width="96" height="40" rx="10"/></g><text x="267" y="402" class="d-label" text-anchor="middle">Indexer</text><rect x="76.8" y="60" width="86" height="30" rx="4" class="d-chip"/><rect x="107.25" y="-3" width="86" height="30" rx="4" class="d-chip"/><rect x="156.2" y="272" width="52" height="30" rx="4" class="d-chip"/><rect x="241" y="453.5" width="52" height="16" rx="4" class="d-chip"/><rect x="27" y="457.5" width="45" height="16" rx="4" class="d-chip"/><rect x="20" y="318.2" width="59" height="16" rx="4" class="d-chip"/><rect x="116.3" y="199" width="59" height="16" rx="4" class="d-chip"/><text x="119.8" y="71" class="d-elabel" text-anchor="middle">HTTP 40403,</text><text x="119.8" y="85" class="d-elabel" text-anchor="middle">gRPC 40401</text><text x="150.25" y="8" class="d-elabel" text-anchor="middle">HTTP 40403,</text><text x="150.25" y="22" class="d-elabel" text-anchor="middle">gRPC 40401</text><text x="182.2" y="283" class="d-elabel" text-anchor="middle">gRPC /</text><text x="182.2" y="297" class="d-elabel" text-anchor="middle">HTTP</text><text x="267" y="464.5" class="d-elabel" text-anchor="middle">writes</text><text x="49.5" y="468.5" class="d-elabel" text-anchor="middle">reads</text><text x="49.5" y="329.2" class="d-elabel" text-anchor="middle">GraphQL</text><text x="145.8" y="210" class="d-elabel" text-anchor="middle">GraphQL</text></g><g class="d-node d-chain"><rect x="4" y="618" width="22" height="14" rx="4"/></g><text x="34" y="629" class="d-meta">Chain node</text><g class="d-node d-store"><path d="M118 621v8a11 3 0 0 0 22 0v-8a11 3 0 0 0-22 0a11 3 0 0 0 22 0"/></g><text x="148" y="629" class="d-meta">Data store</text><g class="d-node d-service"><rect x="232" y="618" width="22" height="14" rx="4"/></g><text x="262" y="629" class="d-meta">Service</text></svg>
