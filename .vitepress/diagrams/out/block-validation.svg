<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 528 890" width="528" role="img" aria-labelledby="block-validation-w-t block-validation-w-d"><title id="block-validation-w-t">Block validation</title><desc id="block-validation-w-d">A block from a peer is checked in order. If the format or signature is invalid, the block is rejected. If its parents are not in the DAG, it is buffered until they arrive. If the sender has no weight, the block is rejected. Then the block summary, state checkpoint, bonds cache, neglected invalid blocks, neglected equivocations and phlo price are validated, and a failure in any of them rejects the block, where a state hash mismatch fails the checkpoint. Last comes the equivocation check, and a block that passes it is added to the DAG and relayed.</desc><defs>
<marker id="block-validation-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="block-validation-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M112 40 L112 70" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M206.5 101 L500 101 Q508 101 508 109 L508 546 Q508 554 500 554 L455 554" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 132 L112 167" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M195.46 181 L334 181" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M334 199 L195.46 199" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 213 L112 248" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 294 L112 324" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 364 L112 394" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 434 L112 464" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 504 L112 534" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 574 L112 604" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 644 L112 674" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 714 L112 744" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 784 L112 814" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M214.5 271 L399 271 Q407 271 407 279 L407 534" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M181 344 L399 344 Q407 344 407 352 L407 534" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M192.5 414 L399 414 Q407 414 407 422 L407 534" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M173 484 L399 484 Q407 484 407 492 L407 534" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M224 554 L359 554" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M220 624 L399 624 Q407 624 407 616 L407 574" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M169 694 L399 694 Q407 694 407 686 L407 574" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M200.5 764 L399 764 Q407 764 407 756 L407 574" class="d-edge" marker-end="url(#block-validation-w-a)"/><g class="d-node d-terminal"><rect x="35" y="0" width="154" height="40" rx="20"/></g><text x="112" y="24" class="d-label" text-anchor="middle">Block received</text><g class="d-node d-decision"><polygon points="17.5,101 35.5,70 188.5,70 206.5,101 188.5,132 35.5,132"/></g><text x="112" y="97" class="d-label" text-anchor="middle">Format and</text><text x="112" y="113" class="d-label" text-anchor="middle">signature valid?</text><g class="d-node d-decision"><polygon points="21.5,190 39.5,167 184.5,167 202.5,190 184.5,213 39.5,213"/></g><text x="112" y="194" class="d-label" text-anchor="middle">Parents in DAG?</text><g class="d-node d-decision"><polygon points="9.5,271 27.5,248 196.5,248 214.5,271 196.5,294 27.5,294"/></g><text x="112" y="275" class="d-label" text-anchor="middle">Sender has weight?</text><g class="d-node d-service"><rect x="43" y="324" width="138" height="40" rx="10"/></g><text x="112" y="348" class="d-label" text-anchor="middle">Block summary</text><g class="d-node d-service"><rect x="31.5" y="394" width="161" height="40" rx="10"/></g><text x="112" y="418" class="d-label" text-anchor="middle">State checkpoint</text><g class="d-node d-service"><rect x="51" y="464" width="122" height="40" rx="10"/></g><text x="112" y="488" class="d-label" text-anchor="middle">Bonds cache</text><g class="d-node d-service"><rect x="0" y="534" width="224" height="40" rx="10"/></g><text x="112" y="558" class="d-label" text-anchor="middle">Neglected invalid blocks</text><g class="d-node d-service"><rect x="4" y="604" width="216" height="40" rx="10"/></g><text x="112" y="628" class="d-label" text-anchor="middle">Neglected equivocations</text><g class="d-node d-service"><rect x="55" y="674" width="114" height="40" rx="10"/></g><text x="112" y="698" class="d-label" text-anchor="middle">Phlo price</text><g class="d-node d-service"><rect x="23.5" y="744" width="177" height="40" rx="10"/></g><text x="112" y="768" class="d-label" text-anchor="middle">Equivocation check</text><g class="d-node d-terminal"><rect x="12" y="814" width="200" height="40" rx="20"/></g><text x="112" y="838" class="d-label" text-anchor="middle">Add to DAG and relay</text><g class="d-node d-service"><rect x="334" y="162" width="146" height="56" rx="10"/></g><text x="407" y="186" class="d-label" text-anchor="middle">Buffer until</text><text x="407" y="202" class="d-label" text-anchor="middle">parents arrive</text><g class="d-node d-terminal"><rect x="359" y="534" width="96" height="40" rx="20"/></g><text x="407" y="558" class="d-label" text-anchor="middle">Reject</text><rect x="496" y="337" width="24" height="16" rx="4" class="d-chip"/><rect x="96.5" y="142.5" width="31" height="16" rx="4" class="d-chip"/><rect x="252.73" y="174" width="24" height="16" rx="4" class="d-chip"/><rect x="96.5" y="223.5" width="31" height="16" rx="4" class="d-chip"/><rect x="96.5" y="302" width="31" height="16" rx="4" class="d-chip"/><rect x="267" y="264" width="24" height="16" rx="4" class="d-chip"/><rect x="249.5" y="337" width="59" height="16" rx="4" class="d-chip"/><rect x="239.5" y="400" width="79" height="30" rx="4" class="d-chip"/><rect x="249.5" y="477" width="59" height="16" rx="4" class="d-chip"/><rect x="262" y="547" width="59" height="16" rx="4" class="d-chip"/><rect x="249.5" y="617" width="59" height="16" rx="4" class="d-chip"/><rect x="249.5" y="687" width="59" height="16" rx="4" class="d-chip"/><rect x="232.5" y="757" width="93" height="16" rx="4" class="d-chip"/><text x="508" y="348" class="d-elabel" text-anchor="middle">No</text><text x="112" y="153.5" class="d-elabel" text-anchor="middle">Yes</text><text x="264.73" y="185" class="d-elabel" text-anchor="middle">No</text><text x="112" y="234.5" class="d-elabel" text-anchor="middle">Yes</text><text x="112" y="313" class="d-elabel" text-anchor="middle">Yes</text><text x="279" y="275" class="d-elabel" text-anchor="middle">No</text><text x="279" y="348" class="d-elabel" text-anchor="middle">invalid</text><text x="279" y="411" class="d-elabel" text-anchor="middle">state hash</text><text x="279" y="425" class="d-elabel" text-anchor="middle">mismatch</text><text x="279" y="488" class="d-elabel" text-anchor="middle">invalid</text><text x="291.5" y="558" class="d-elabel" text-anchor="middle">invalid</text><text x="279" y="628" class="d-elabel" text-anchor="middle">invalid</text><text x="279" y="698" class="d-elabel" text-anchor="middle">invalid</text><text x="279" y="768" class="d-elabel" text-anchor="middle">equivocation</text></g><g class="d-node d-service"><rect x="4" y="870" width="22" height="14" rx="4"/></g><text x="34" y="881" class="d-meta">Check</text><g class="d-node d-decision"><polygon points="85,877 90,870 102,870 107,877 102,884 90,884"/></g><text x="115" y="881" class="d-meta">Decision</text><g class="d-node d-terminal"><rect x="186" y="870" width="22" height="14" rx="7"/></g><text x="216" y="881" class="d-meta">Start or end</text></svg>
