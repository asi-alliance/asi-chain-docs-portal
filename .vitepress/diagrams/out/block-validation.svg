<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 528 814" width="528" role="img" aria-labelledby="block-validation-w-t block-validation-w-d"><title id="block-validation-w-t">Block validation</title><desc id="block-validation-w-d">A block from a peer is checked in order. If the format or signature is invalid, the block is rejected. If its parents are not in the DAG, it is buffered until they arrive. Then the block summary, state checkpoint, bonds cache, neglected invalid blocks, neglected equivocations and phlo price are validated, and a failure in any of them rejects the block, where a state hash mismatch fails the checkpoint. Last comes the equivocation check, and a block that passes it is added to the DAG and relayed.</desc><defs>
<marker id="block-validation-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
<marker id="block-validation-w-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow d-arrow-strong"/></marker></defs><g transform="translate(4 4)"><path d="M112 40 L112 70" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M206.5 101 L500 101 Q508 101 508 109 L508 470 Q508 478 500 478 L455 478" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 132 L112 167" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M195.46 181 L334 181" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M334 199 L195.46 199" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 213 L112 248" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 288 L112 318" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 358 L112 388" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 428 L112 458" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 498 L112 528" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 568 L112 598" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 638 L112 668" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M112 708 L112 738" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M181 268 L399 268 Q407 268 407 276 L407 458" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M192.5 338 L399 338 Q407 338 407 346 L407 458" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M173 408 L399 408 Q407 408 407 416 L407 458" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M224 478 L359 478" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M220 548 L399 548 Q407 548 407 540 L407 498" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M169 618 L399 618 Q407 618 407 610 L407 498" class="d-edge" marker-end="url(#block-validation-w-a)"/><path d="M200.5 688 L399 688 Q407 688 407 680 L407 498" class="d-edge" marker-end="url(#block-validation-w-a)"/><g class="d-node d-terminal"><rect x="35" y="0" width="154" height="40" rx="20"/></g><text x="112" y="24" class="d-label" text-anchor="middle">Block received</text><g class="d-node d-decision"><polygon points="17.5,101 35.5,70 188.5,70 206.5,101 188.5,132 35.5,132"/></g><text x="112" y="97" class="d-label" text-anchor="middle">Format and</text><text x="112" y="113" class="d-label" text-anchor="middle">signature valid?</text><g class="d-node d-decision"><polygon points="21.5,190 39.5,167 184.5,167 202.5,190 184.5,213 39.5,213"/></g><text x="112" y="194" class="d-label" text-anchor="middle">Parents in DAG?</text><g class="d-node d-service"><rect x="43" y="248" width="138" height="40" rx="10"/></g><text x="112" y="272" class="d-label" text-anchor="middle">Block summary</text><g class="d-node d-service"><rect x="31.5" y="318" width="161" height="40" rx="10"/></g><text x="112" y="342" class="d-label" text-anchor="middle">State checkpoint</text><g class="d-node d-service"><rect x="51" y="388" width="122" height="40" rx="10"/></g><text x="112" y="412" class="d-label" text-anchor="middle">Bonds cache</text><g class="d-node d-service"><rect x="0" y="458" width="224" height="40" rx="10"/></g><text x="112" y="482" class="d-label" text-anchor="middle">Neglected invalid blocks</text><g class="d-node d-service"><rect x="4" y="528" width="216" height="40" rx="10"/></g><text x="112" y="552" class="d-label" text-anchor="middle">Neglected equivocations</text><g class="d-node d-service"><rect x="55" y="598" width="114" height="40" rx="10"/></g><text x="112" y="622" class="d-label" text-anchor="middle">Phlo price</text><g class="d-node d-service"><rect x="23.5" y="668" width="177" height="40" rx="10"/></g><text x="112" y="692" class="d-label" text-anchor="middle">Equivocation check</text><g class="d-node d-terminal"><rect x="12" y="738" width="200" height="40" rx="20"/></g><text x="112" y="762" class="d-label" text-anchor="middle">Add to DAG and relay</text><g class="d-node d-service"><rect x="334" y="162" width="146" height="56" rx="10"/></g><text x="407" y="186" class="d-label" text-anchor="middle">Buffer until</text><text x="407" y="202" class="d-label" text-anchor="middle">parents arrive</text><g class="d-node d-terminal"><rect x="359" y="458" width="96" height="40" rx="20"/></g><text x="407" y="482" class="d-label" text-anchor="middle">Reject</text><rect x="496" y="296" width="24" height="16" rx="4" class="d-chip"/><rect x="96.5" y="142.5" width="31" height="16" rx="4" class="d-chip"/><rect x="252.73" y="174" width="24" height="16" rx="4" class="d-chip"/><rect x="96.5" y="223.5" width="31" height="16" rx="4" class="d-chip"/><rect x="249.5" y="261" width="59" height="16" rx="4" class="d-chip"/><rect x="239.5" y="324" width="79" height="30" rx="4" class="d-chip"/><rect x="249.5" y="401" width="59" height="16" rx="4" class="d-chip"/><rect x="262" y="471" width="59" height="16" rx="4" class="d-chip"/><rect x="249.5" y="541" width="59" height="16" rx="4" class="d-chip"/><rect x="249.5" y="611" width="59" height="16" rx="4" class="d-chip"/><rect x="232.5" y="681" width="93" height="16" rx="4" class="d-chip"/><text x="508" y="307" class="d-elabel" text-anchor="middle">No</text><text x="112" y="153.5" class="d-elabel" text-anchor="middle">Yes</text><text x="264.73" y="185" class="d-elabel" text-anchor="middle">No</text><text x="112" y="234.5" class="d-elabel" text-anchor="middle">Yes</text><text x="279" y="272" class="d-elabel" text-anchor="middle">invalid</text><text x="279" y="335" class="d-elabel" text-anchor="middle">state hash</text><text x="279" y="349" class="d-elabel" text-anchor="middle">mismatch</text><text x="279" y="412" class="d-elabel" text-anchor="middle">invalid</text><text x="291.5" y="482" class="d-elabel" text-anchor="middle">invalid</text><text x="279" y="552" class="d-elabel" text-anchor="middle">invalid</text><text x="279" y="622" class="d-elabel" text-anchor="middle">invalid</text><text x="279" y="692" class="d-elabel" text-anchor="middle">equivocation</text></g><g class="d-node d-service"><rect x="4" y="794" width="22" height="14" rx="4"/></g><text x="34" y="805" class="d-meta">Check</text><g class="d-node d-decision"><polygon points="85,801 90,794 102,794 107,801 102,808 90,808"/></g><text x="115" y="805" class="d-meta">Decision</text><g class="d-node d-terminal"><rect x="186" y="794" width="22" height="14" rx="7"/></g><text x="216" y="805" class="d-meta">Start or end</text></svg>
