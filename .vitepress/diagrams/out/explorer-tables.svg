<svg xmlns="http://www.w3.org/2000/svg" class="dgm flow" viewBox="0 0 874 712" width="874" role="img" aria-labelledby="explorer-tables-w-t explorer-tables-w-d"><title id="explorer-tables-w-t">Indexer tables</title><desc id="explorer-tables-w-d">The blocks table is the centre of the indexer database. The tables block_parents, block_validators, validator_bonds, balance_states, deployments, transfers, native_transfer_calls and native_transfer_results all refer to blocks by block_hash. Deployments are also referred to by transfers, native_transfer_calls and native_transfer_results by deploy_id, native_transfer_results refer to native_transfer_calls by call_id, and transfers refer to native_transfer_results by native_result_id. Six tables have no foreign keys: validators, pending_deploys, epoch_transitions, network_stats, indexer_state and network_metrics_buckets.</desc><defs>
<marker id="explorer-tables-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" class="d-arrow"/></marker>
