"161" class="d-meta" text-anchor="middle">PK block_hash,</text><text x="84" y="175" class="d-meta" text-anchor="middle">validator_public_key</text><g class="d-node d-service"><rect x="7.5" y="230" width="153" height="68" rx="10"/></g><text x="84" y="254" class="d-label" text-anchor="middle">validator_bonds</text><text x="84" y="269" class="d-meta" text-anchor="middle">PK id</text><text x="84" y="283" class="d-meta" text-anchor="middle">FK block_hash</text><g class="d-node d-service"><rect x="11" y="345" width="146" height="68" rx="10"/></g><text x="84" y="369" class="d-label" text-anchor="middle">balance_states</text><text x="84" y="384" class="d-meta" text-anchor="middle">PK id</text><text x="84" y="398" class="d-meta" text-anchor="middle">FK block_hash</text><g class="d-node d-chain"><rect x="213.5" y="183" width="122" height="54" rx="10"/></g><text x="274.5" y="207" class="d-label" text-anchor="middle">blocks</text><text x="274.5" y="222" class="d-meta" text-anchor="middle">PK block_hash</text><g class="d-node d-service"><rect x="414.5" y="0" width="201" height="82" rx="10"/></g><text x="515" y="24" class="d-label" text-anchor="middle">transfers</text><text x="515" y="39" class="d-meta" text-anchor="middle">PK id</text><text x="515" y="53" class="d-meta" text-anchor="middle">FK deploy_id, block_hash,</text><text x="515" y="67" class="d-meta" text-anchor="middle">native_result_id</text><g class="d-node d-service"><rect x="454" y="122" width="122" height="68" rx="10"/></g><text x="515" y="146" class="d-label" text-anchor="middle">deployments</text><text x="515" y="161" class="d-meta" text-anchor="middle">PK deploy_id</text><text x="515" y="175" class="d-meta" text-anchor="middle">FK block_hash</text><g class="d-node d-service"><rect x="415" y="230" width="200" height="68" rx="10"/></g><text x="515" y="254" class="d-label" text-anchor="middle">native_transfer_calls</text><text x="515" y="269" class="d-meta" text-anchor="middle">PK id</text><text x="515" y="283" clas