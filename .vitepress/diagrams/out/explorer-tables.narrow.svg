ddle">PK block_hash,</text><text x="108" y="235" class="d-meta" text-anchor="middle">validator_public_key</text><g class="d-node d-service"><rect x="31.5" y="280" width="153" height="68" rx="10"/></g><text x="108" y="304" class="d-label" text-anchor="middle">validator_bonds</text><text x="108" y="319" class="d-meta" text-anchor="middle">PK id</text><text x="108" y="333" class="d-meta" text-anchor="middle">FK block_hash</text><g class="d-node d-service"><rect x="35" y="378" width="146" height="68" rx="10"/></g><text x="108" y="402" class="d-label" text-anchor="middle">balance_states</text><text x="108" y="417" class="d-meta" text-anchor="middle">PK id</text><text x="108" y="431" class="d-meta" text-anchor="middle">FK block_hash</text><g class="d-node d-chain"><rect x="47" y="0" width="122" height="54" rx="10"/></g><text x="108" y="24" class="d-label" text-anchor="middle">blocks</text><text x="108" y="39" class="d-meta" text-anchor="middle">PK block_hash</text><g class="d-node d-service"><rect x="7.5" y="476" width="201" height="82" rx="10"/></g><text x="108" y="500" class="d-label" text-anchor="middle">transfers</text><text x="108" y="515" class="d-meta" text-anchor="middle">PK id</text><text x="108" y="529" class="d-meta" text-anchor="middle">FK deploy_id, block_hash,</text><text x="108" y="543" class="d-meta" text-anchor="middle">native_result_id</text><g class="d-node d-service"><rect x="47" y="588" width="122" height="68" rx="10"/></g><text x="108" y="612" class="d-label" text-anchor="middle">deployments</text><text x="108" y="627" class="d-meta" text-anchor="middle">PK deploy_id</text><text x="108" y="641" class="d-meta" text-anchor="middle">FK block_hash</text><g class="d-node d-service"><rect x="8" y="686" width="200" height="68" rx="10"/></g><text x="108" y="710" class="d-label" text-anchor="middle">native_transfer_calls</text><text x="108" y="725" class="d-meta" text-anchor="middle">PK id</text><text x="108" y="739" class="d-meta" text-anchor="middle">FK block_hash, deploy_id</text><g class="d-node d-service"><rect x="0" y="784" width="216" height="82" rx="10"/></g><text x="108" y="808" class="d-label" text-anchor="middle">native_transfer_results</text><text x="108" y="823" class="d-meta" text-anchor="middle">PK id</text><text x="108" y="837" class="d-meta" text-anchor="middle">FK call_id, block_hash,</text><text x="108" y="851" class="d-meta" text-anchor="middle">deploy_id</text><g class="d-node d-service"><rect x="47" y="946" width="122" height="54" rx="10"/></g><text x="108" y="970" class="d-label" text-anchor="middle">validators</text><text x="108" y="985" class="d-meta" text-anchor="middle">PK public_key</text><g class="d-node d-service"><rect x="31.5" y="1018" width="153" height="54" rx="10"/></g><text x="108" y="1042" class="d-label" text-anchor="middle">pending_deploys</text><text x="108" y="1057" class="d-meta" text-anchor="middle">PK sig</text><g class="d-node d-service"><rect x="23.5" y="1090" width="169" height="54" rx="10"/></g><text x="108" y="1114" class="d-label" text-anchor="middle">epoch_transitions</text><text x="108" y="1129" class="d-meta" text-anchor="middle">PK id</text><g class="d-node d-service"><rect x="39" y="1162" width="138" height="54" rx="10"/></g><text x="108" y="1186" class="d-label" text-anchor="middle">network_stats</text><text x="108" y="1201" class="d-meta" text-anchor="middle">PK id</text><g class="d-node d-service"><rect x="39" y="1234" width="138" height="54" rx="10"/></g><text x="108" y="1258" class="d-label" text-anchor="middle">indexer_state</text><text x="108" y="1273" class="d-meta" text-anchor="middle">PK key</text><g class="d-node d-service"><rect x="0" y="1306" width="216" height="54" rx="10"/></g><text x="108" y="1330" class="d-label" text-anchor="middle">network_metrics_buckets</text><text x="108" y="1345" class="d-meta" text-anchor="middle">PK bucket_start</text><rect x="71.5" y="566" width="73" height="16" rx="4" class="d-chip"/><rect x="71.5" y="664" width="73" height="16" rx="4" class="d-chip"/><rect x="78.5" y="762" width="59" height="16" rx="4" class="d-chip"/><text x="108" y="577" class="d-elabel" text-anchor="middle">deploy_id</text><text x="108" y="675" class="d-elabel" text-anchor="middle">deploy_id</text><text x="108" y="773" class="d-elabel" text-anchor="middle">call_id</text></g><g class="d-node d-chain"><rect x="4" y="1394" width="22" height="14" rx="4"/></g><text x="34" y="1405" class="d-meta">Central table</text><g class="d-node d-service"><rect x="138" y="1394" width="22" height="14" rx="4"/></g><text x="168" y="1405" class="d-meta">Table</text></svg>
