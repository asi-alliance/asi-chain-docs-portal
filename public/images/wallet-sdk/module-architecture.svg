  <text x="339" y="402" text-anchor="middle" class="mod-label">Asset</text>
  <rect x="444" y="380" width="185" height="34" rx="5" class="mod"/>
  <text x="536" y="402" text-anchor="middle" class="mod-label">BrowserStorage</text>
  <rect x="641" y="380" width="185" height="34" rx="5" class="mod"/>
  <text x="733" y="402" text-anchor="middle" class="mod-label">CustomError</text>

  <line x1="440" y1="424" x2="440" y2="444" class="arrow"/>
  <polygon points="435,441 440,449 445,441" class="arrow-head"/>
  <text x="458" y="441" class="uses">uses</text>

  <rect x="30" y="454" width="820" height="90" rx="8" class="layer-bg"/>
  <rect x="30" y="454" width="4" height="90" rx="2" class="layer-border-u"/>
  <text x="54" y="474" class="layer-title">UTILITIES</text>
  <rect x="50" y="484" width="148" height="34" rx="5" class="mod"/>
