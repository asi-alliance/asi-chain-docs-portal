  <text x="339" y="288" text-anchor="middle" class="mod-label">SignerService</text>
  <rect x="444" y="266" width="185" height="34" rx="5" class="mod"/>
  <text x="536" y="288" text-anchor="middle" class="mod-label">AssetsService</text>

  <line x1="440" y1="320" x2="440" y2="342" class="arrow"/>
  <polygon points="435,339 440,347 445,339" class="arrow-head"/>
  <text x="458" y="338" class="uses">uses</text>

  <rect x="30" y="352" width="820" height="72" rx="8" class="layer-bg"/>
